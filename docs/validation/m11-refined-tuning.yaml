      reason: 'Disabled by the builder for total particle loading: the initial particle
        concentration is not an equilibrium capacity. Kernel loading follows its source
        partition law and may exceed its initial value during inward diffusion. This
        boundary restriction is not selected by fit quality.'
    - id: model.hydraulics.pore_air_amplitude
      reason: The initial effective connectivity deficit is a grade D model assumption
        (0.5), separate from coffee CO2; it is not a measured gas volume fraction.
        None of the calibration observables identifies a transient relative-permeability
        law. It is held at its prior rather than fitted to the held-out V4 first-drop
        delay or flow rise.
    - id: model.hydraulics.pore_air_permeability_exponent
      reason: The effective connectivity-to-relative-permeability exponent is a grade
        D closure (3), not measured for these pucks. Held fixed; the V4 transient,
        V3 and V5 shot times do not select it.
    - id: model.hydraulics.moisture_diffusivity
      reason: The pore-air relaxation time uses (D32/2)^2/(pi^2 D), capped at 600
        s, with D = 2.5e-11 m^2/s from the independent Mateus moisture-uptake range.
        Using moisture diffusion for air clearance is a grade D model assumption.
        Neither this diffusivity nor its time scale is fitted to held-out shots.
    - id: model.hydraulics.wetting_uptake
      reason: In M1.1 this is the fixed effective-loading normalization inherited
        from the extraction model, distinct from the full intraparticle water inventory.
        It is not fitted to startup observations.
    - id: extraction.diffusivity.caffeine.particle_80c
      reason: 'Species kernel diffusivities trade off with the coffee''s contents
        (correlation −0.89 to −0.95): their posterior SD was 2–12× the prior''s, and
        free fits drifted 2–5× outside the literature priors (caffeine to 8×10⁻¹¹,
        trigonelline to the 1×10⁻⁹ bound). The species surface-pool scales carry the
        species'' λ instead.'
    - id: model.species.trigonelline.diffusivity_80c
      reason: Not identified by V1 (see the caffeine diffusivity).
    - id: model.species.cqa5.diffusivity_80c
      reason: Not identified by V1 (see the caffeine diffusivity).
    - id: extraction.surface_rate.grudeva2026
      reason: Not identified by V1 (posterior SD 44× the prior's once the lumped diffusivity
        is fixed); the surface flux is fast at any value in its range, so only the
        surface pool's size matters.
    - id: model.hydraulics.swelling_pore_closure
      reason: Not identified by V1 (posterior SD 1.6× the prior's when added at the
        V1 optimum); the residuals lean towards less swelling (Wald z 2.4 towards
        0).
    - id: model.hydraulics.gas_amplitude_max
      reason: Weakly identified by V1 (posterior SD 0.4–0.7× the prior's) with no
        evidence against the registry value (Wald z 0.8); the CO₂ model is being re-anchored
        in the input models.
    - id: hydraulics.dissolution_porosity_share
      reason: 'θ is fixed at its mechanistic default, 0 (the insoluble cell walls
        hold the particle envelope), not chosen by fit quality: it is collinear with
        the bed permeability, whose fitted values move to absorb it. `calibrate --sensitivity`
        reports the θ = 0.27 case as a structural sensitivity.'
    - id: model.species.cqa5.partition

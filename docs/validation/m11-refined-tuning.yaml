    model.hydraulics.pore_air_amplitude:
      value: 0.5
      units: '1'
      reason: The initial effective connectivity deficit is a grade D model assumption
        (0.5), separate from coffee CO2; it is not a measured gas volume fraction.
        None of the calibration observables identifies a transient relative-permeability
        law. It is held at its prior rather than fitted to the held-out V4 first-drop
        delay or flow rise.
    model.hydraulics.pore_air_permeability_exponent:
      value: 3.0
      units: '1'
      reason: The effective connectivity-to-relative-permeability exponent is a grade
        D closure (3), not measured for these pucks. Held fixed; the V4 transient,
        V3 and V5 shot times do not select it.
    model.hydraulics.moisture_diffusivity:
      value: 2.5e-11
      units: m^2/s
      reason: The pore-air relaxation time uses (D32/2)^2/(pi^2 D), capped at 600
        s, with D = 2.5e-11 m^2/s from the independent Mateus moisture-uptake range.
        Using moisture diffusion for air clearance is a grade D model assumption.
        Neither this diffusivity nor its time scale is fitted to held-out shots.
    model.hydraulics.wetting_uptake:
      value: 0.5
      units: '1'
      reason: In M1.1 this is the fixed effective-loading normalization inherited
        from the extraction model, distinct from the full intraparticle water inventory.
        It is not fitted to startup observations.
    extraction.diffusivity.caffeine.particle_80c:
      value: 1.9e-10
      units: m^2/s
      reason: 'Species kernel diffusivities trade off with the coffee''s contents
        (correlation −0.89 to −0.95): their posterior SD was 2–12× the prior''s, and
        free fits drifted 2–5× outside the literature priors (caffeine to 8×10⁻¹¹,

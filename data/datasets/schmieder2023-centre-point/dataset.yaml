# SPDX-License-Identifier: GPL-2.0-or-later
# Sidecar for data.csv. The data come from a CC BY 4.0 article (see `licence`);
# this metadata file is part of Puckworks.
schema: puckworks.dataset/1
id: schmieder2023-centre-point
title: >-
  Espresso extraction kinetics of trigonelline, caffeine, 5-CQA and TDS at the centre point of a
  flow-rate, grind and temperature design (Schmieder et al. 2023)
citation: >-
  Schmieder B.K.L., Pannusch V.B., Vannieuwenhuyse L., Briesen H., Minceva M. (2023) Influence of
  flow rate, particle size, and temperature on espresso extraction kinetics. Foods 12(15):2871.
doi: "10.3390/foods12152871"
url: "https://www.mdpi.com/2304-8158/12/15/2871"
licence: CC-BY-4.0
redistribution: allowed
retrieved: "2026-10-14"
research_note_ref: ["02 §3.1", "01 §9"]

obtained: >-
  Copied by hand from the open-access article (version of record, PDF from MDPI, retrieved
  2026-10-14): Table A1 (parameters of c(m) = c₀ exp(−m/λ) fitted to each experiment's average
  extraction kinetics, with standard errors) and Table 2 (component masses in the cup for 20, 40 and
  60 g of beverage, with relative standard deviations). Values are as printed; nothing was digitised
  from figures. The design minima and maxima were selected from all 15 rows of Table A1.

uncertainty: >-
  Transcription: none expected; every number was read twice, from the rendered page and from the PDF
  text layer, and the design extremes were selected by script from the text layer. Statistical: `se`
  is the standard error of the fit printed in Table A1; `rsd_percent` is the relative standard
  deviation across replicates printed in Table 2 (3 replicates per experiment, 6 at the centre point).
  The design-mean row of Table 2 has no printed RSD.

columns:
  - name: analyte
    type: string
    description: "Component: trigonelline, caffeine, 5-CQA (5-caffeoylquinic acid) or TDS (total dissolved solids)."
  - name: quantity
    type: string
    description: >-
      lambda and c0: fit parameters at the centre point; lambda_design_min/max and c0_design_min/max:
      smallest and largest over the 15 experiments; cup_mass: mass in the cup at the centre point;
      cup_mass_design_mean: mass in the cup averaged over the 15 experiments.
  - name: beverage_mass_g
    type: number
    units: g
    required: false
    description: Beverage mass (20, 40 or 60 g, i.e. brew ratios 1:1, 1:2, 1:3) for cup masses; empty otherwise.
  - name: value
    type: number
    units_column: unit
    description: The value, in the units of the `unit` column.
  - name: unit
    type: string
    description: Unit of `value` and `se` (from data/schema/units.yaml).
  - name: se
    type: number
    units_column: unit
    required: false
    description: Standard error of the fit parameter (Table A1); empty for cup masses.
  - name: rsd_percent
    type: number
    units: "%"
    required: false
    description: Relative standard deviation across replicates (Table 2); empty where not printed.
  - name: experiment
    type: integer
    required: false
    description: Experiment number of the design (7 is the centre point); empty for design means.
  - name: source_locator
    type: string
    description: Table of the article the value was copied from.

files:
  - path: data.csv
    format: csv
    description: >-
      λ and c₀ at the centre point and the design extremes (Table A1); cup masses at the centre point
      and averaged over the design (Table 2).

notes: >-
  Design: a face-centred central composite design of 15 experiments with set flow rates 1.0, 2.0 and
  3.0 mL/s, grinding levels 1.4, 1.7 and 2.0 (Mahlkönig E65S) and set temperatures 80, 89 and 98 °C.
  Experiment 7 is the centre point (set 2.0 mL/s, GL 1.7, 89 °C; measured 1.9 mL/s with RSD 2.3%,
  88.3 °C with RSD 0.5%, peak brew pressure 3.4 bar with RSD 15.6%, the mean of the per-shot maxima of
  Table S3; 6 replicates). Setup: Decent DE1 Pro,
  IMS BT702Th26.5M precision basket and IMS Cl 200 IM shower screen; 20 ± 0.01 g of washed Colombian
  Arabica (Colombia Suprema Huila), roasted in a CRS-30 roaster from 180 to 212 °C (190 °C at first
  crack) in about 10 min and rested two weeks; Grande TRE distribution tool; 25 kg tamp; Acqua Panna
  water; preinfusion at 7 mL/s until the pressure exceeded 2.5 bar; ten fractions of about 6 g, of
  which fractions 1, 2, 3, 5, 7 and 10 were analysed. At GL 1.7 the wet-measured volume mean diameter
  D[4,3] was 277 µm (SD 17.0) and the Sauter diameter 26.9 µm (SD 3.2).
  Cup masses were computed by the authors as the first fraction's measured mass times its
  concentration plus the integral of the fitted exponential up to the beverage mass (their Eq. 3),
  averaged over replicates.
  Cross-check with research note 02 (Table 5 and Table 2): the note's centre-point λ (16.1, 23.1,
  20.8 and 17.5 g), c₀ (6.70, 9.71 and 6.79 mg/g and 0.248 g/g) and design ranges of λ agree with
  Table A1 after rounding, and its cup caffeine (129/184/207 mg) and TDS (2.92/3.88/4.19 g) are the
  centre-point row of Table 2. Two labelling nuances: the note's 4.57 mg/g caffeine for a 40 g cup
  (with 2.45 mg/g trigonelline, 2.96 mg/g 5-CQA and 9.68% TDS) is the paper's average over all 15
  experiments, not the centre point (183.8 mg in 40 g, 4.60 mg/g); and the EY of 19.4% the note
  attributes to Schmieder is not printed in the paper but follows from 3.88 g of dissolved solids from
  a 20 g dose (19.35% for the design-average 3.87 g).
  The supplementary materials are in the M1 datasets schmieder2023-fractions (Table S1) and
  schmieder2023-replicates (Table S3); the full Tables 1, 2 and A1 are in schmieder2023-design and
  schmieder2023-kinetics. Attribution: cite the article above when redistributing these data (CC BY 4.0).

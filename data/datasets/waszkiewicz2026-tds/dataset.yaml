schema: puckworks.dataset/1
id: waszkiewicz2026-tds
title: >-
  TDS of consecutive 5 s fractions of an espresso shot at about 9 bar, three replicates
  (Waszkiewicz et al. 2026, Fig. 7B)
citation: >-
  Waszkiewicz R., Myck F., Białas Ł., Puciata-Mroczynska M., Dzikowski M., Szymczak P., Lisicki M.
  (2026) Under pressure: poroelastic regulation of flow in espresso brewing. Phys. Fluids 38:063113.
  Data: Zenodo, v1.0.1, doi:10.5281/zenodo.18046315.
doi: "10.5281/zenodo.18046315"
url: "https://github.com/RadostW/espresso"
licence: CC-BY-4.0
redistribution: allowed
retrieved: "2026-10-14"
research_note_ref: ["01 §9", "01 §4.11"]

obtained: >-
  Converted by script (python/puckworks_tools/sources/waszkiewicz2026.py) from
  measurements_tds_calibration/tds.csv (replicates; sha256
  8900260934232051d4c54b565453f24c65d729743bd2fca480e00d0ef65bc239) and formatted_measurements/tds.csv
  (the authors' means and standard errors; sha256
  f22ee533f4c3e4c4c2587192a9aefa9af43bf8d47dd4456a611bfd92fb673847) of the Zenodo archive. Values as
  stored.

uncertainty: >-
  Transcription: none. Statistical: tds_sem_percent is the standard error of the mean of the three
  replicates (the authors' column "tds_std", which equals the sample SD divided by √3). Refractometer:
  VST LAB; the most concentrated early fractions were diluted with distilled water before reading.
  Replicates differ by up to 8 TDS points in the first fractions, so the shot-to-shot spread, not the
  instrument, dominates.

columns:
  - name: time_mid_s
    type: number
    units: s
    description: Middle of the 5 s collection window, on the TDS experiments' own clock (see notes).
  - name: tds_percent
    type: number
    units: "%"
    description: Mean TDS of the fraction over the replicates that collected liquid.
  - name: tds_sem_percent
    type: number
    units: "%"
    required: false
    description: Standard error of the mean (empty when only one replicate collected liquid).
  - name: tds_rep1_percent
    type: number
    units: "%"
    required: false
    description: TDS of replicate 1.
  - name: tds_rep2_percent
    type: number
    units: "%"
    required: false
    description: TDS of replicate 2 (empty when its tube stayed empty).
  - name: tds_rep3_percent
    type: number
    units: "%"
    required: false
    description: TDS of replicate 3 (empty when its tube stayed empty).

files:
  - path: tds.csv
    format: csv
    description: 12 rows, fractions from 0–5 s to 55–60 s.

notes: >-
  Each shot was split into tubes every 5 s ("every 5 seconds of the brewing process"); in the article's
  example the first tube stayed empty. Only replicate 1 collected liquid in the first window. The
  authors fit TDS(t) = ½k[1 − tanh((t − ℓ)/m)] with k = 25.6 ± 1.3 %, ℓ = 20.9 ± 0.9 s, m = 8.9 ± 1.5 s
  (fit_parameters/tds_calibration.csv), and when combining TDS with the flow data of the 9-bar group
  they shift the TDS clock by 8 s (fit_model_solids.py, FIRST_DROP_OFFSET), i.e. TDS time 0 is taken as
  8 s after the flow clock's zero, about when the first drops fall. The resulting dissolved mass is
  k_m = 2.257 g (about 12% of the 18.5 g dose). The brewing pressure of these shots is not stated
  separately; the 8 s offset is applied to the 9-bar flow data. Conditions as in
  waszkiewicz2026-flow-transient. Attribution: cite the article and the Zenodo record.

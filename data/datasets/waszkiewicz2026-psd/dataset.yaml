# this metadata file is part of Puckworks.
schema: puckworks.dataset/1
id: waszkiewicz2026-psd
title: >-
  Laser-diffraction volume particle-size distribution of the espresso grind of Waszkiewicz et al.
  (2026), Fiorenzato F64 EVO at setting 1.9, three samples (Fig. 2)
citation: >-
  Waszkiewicz R., Myck F., Białas Ł., Puciata-Mroczynska M., Dzikowski M., Szymczak P., Lisicki M.
  (2026) Under pressure: poroelastic regulation of flow in espresso brewing. Phys. Fluids 38:063113.
  Data: Zenodo, v1.0.1, doi:10.5281/zenodo.18046315.
doi: "10.5281/zenodo.18046315"
url: "https://github.com/RadostW/espresso"
licence: CC-BY-4.0
redistribution: allowed
retrieved: "2026-10-14"
research_note_ref: ["03 §1.4", "01 §9"]

obtained: >-
  Converted by script (python/puckworks_tools/sources/waszkiewicz2026.py) from
  measurements_mastersizer/mastersizer.csv (sha256
  61e59fb7d108ca11c7bc3fc32ea954fe7ca4fbb783042e0784d2b76f0fa99a27) of the Zenodo archive: its first
  line holds 48 bin edges and each of the next three lines 47 volume percentages (after an empty first
  field), so value i belongs to the bin between edges i−1 and i, as in the authors' plotting script.
  Values as stored.

uncertainty: >-
  Transcription: none. Statistical: three samples of the same grind; their volume percentages differ by
  up to 1.3 points in the boulder peak. Method: Malvern Mastersizer 2000 laser diffraction; the
  article does not say whether the dispersion was wet or dry, and laser diffraction reports
  equivalent-sphere diameters whose fines share depends on the dispersion method (research note 03
  §1.4). Each sample sums to 100%.

columns:
  - name: bin_lower_um
    type: number
    units: um
    description: Lower edge of the size bin.
  - name: bin_upper_um
    type: number
    units: um
    description: Upper edge of the size bin (the edges are spaced logarithmically, ratio 10^0.06).
  - name: volume_percent_1
    type: number
    units: "%"
    description: Volume percent of sample 1 in the bin.
  - name: volume_percent_2
    type: number
    units: "%"
    description: Volume percent of sample 2 in the bin.
  - name: volume_percent_3
    type: number
    units: "%"
    description: Volume percent of sample 3 in the bin.

files:
  - path: psd.csv
    format: csv
    description: 47 bins from 0.63 to 417 µm.

notes: >-
  The distribution is bimodal: a fines mode in the 40–46 µm bin and a coarse mode in the 120–138 µm bin;
  the last non-zero bin is 158–182 µm (3.4–3.8% of the volume) and every bin above it, to 417 µm, is
  zero, an abrupt end that suggests the coarse tail is under-represented (the article does not say how
  the samples were dispersed). The article: "fines of typical size of 50 µm and larger grounds of typical
  size below 200 µm". Grind: Fiorenzato F64 EVO, setting 1.9, chosen for the SCA guideline of 37 g in
  32 s at 9 bar; the article's own 9 bar shots reached 37 g at about 48 s. Attribution: cite the article
  and the Zenodo record.

# SPDX-License-Identifier: GPL-2.0-or-later
#
# Named grinders with published PSD data (research note 03 §1.2, §2.2). Each maps its dial to a burr
# gap, gap = gap_at_ref_um + gap_per_unit_um × (setting − ref), and may refine its family's PSD
# parameters. Values derived from published data say how; guesses are flagged `estimated`.
schema: puckworks.preset-file/1
kind: grinder
description: Named grinders with published particle-size data.
presets:
  - id: bentwood-v63
    name: Bentwood Vertical 63
    description: >-
      63 mm flat burrs with a dial calibrated in micrometres of burr spacing. The best-anchored grinder:
      X50 and fines were measured at six spacings (Smrke 2024).
    flags: []
    notes:
      - "X50 ≈ 1.4 × burr spacing was measured over 160–250 µm with a Camsizer X2 (projected-area size, x_area); outside that range the relation is extrapolated."
      - "Fines (volume % below 100 µm) follow the model's fines relation with u_G = 15.7% at X50 = 340 µm, fitted to Smrke 2024's six spacings (within 0.3 points of Q100 at the measured medians)."
    sources:
      - citation: "Smrke S., Eiermann A., Yeretzian C. (2024) The role of fines in espresso extraction dynamics. Sci. Rep. 14:5612."
        doi: "10.1038/s41598-024-55831-x"
        locator: "Fig. 2 (digitized in note 03 §2.2; data/datasets/smrke2024-psd)"
    evidence_grade: B
    tag: fitted
    registry_refs: [psd.x50_gap_ratio, model.psd.fines_weight_slope]
    family: flat-traditional
    burr_diameter_mm: 63
    dial:
      label: "µm of burr spacing"
      min: 50
      max: 1000
      default: 190
      ref: 0
      gap_at_ref_um: 0
      gap_per_unit_um: 1
      anchored: {min: 160, max: 250}
    psd:
      fines_at_340_pct: 15.7

  - id: mahlkoenig-e65s
    name: Mahlkönig E65S
    description: >-
      65 mm flat steel burrs, 1400 rpm (50 Hz; 1700 rpm at 60 Hz), 80-indicator dial. The grinder of the
      Schmieder 2023 extraction-kinetics study; its dial is mapped to a burr gap so that the model
      reproduces the measured volume mean diameters at grind levels 1.4 and 2.0.
    flags: [disputed]
    notes:
      - "Disputed dial scale: the brochure's 180–580 µm over 80 indicators (≈5 µm per indicator) is read as burr movement in note 03 but as a particle-size bandwidth by Schmieder 2023. Neither reading is used directly: the mapping (25 µm of gap per grind-level unit, i.e. 2.5 µm per indicator) is fitted to the measured D43 of 273 µm at GL 1.4 and 295 µm at GL 2.0."
      - "Measured D43 values are by wet laser diffraction (SD 8–18 µm). Wet D32 (27–29 µm) includes 1–10 µm debris; the model's Sauter diameter is dry-equivalent and much larger."
      - "Dial steps of interest (GL 1.4–2.0) are near the repeatability of PSD measurements (03 §2.2)."
    sources:
      - citation: "Schmieder B.K.L., Pannusch V.B., Vannieuwenhuyse L., Briesen H., Minceva M. (2023) Influence of flow rate, particle size, and temperature on espresso extraction kinetics. Foods 12:2871."
        doi: "10.3390/foods12152871"
        locator: "§2.4"
      - citation: "Mahlkönig/Hemro. E65S product brochure (DE)."
        url: "https://downloads.mahlkoenig.de/Products/Mahlkoenig_E65S_Espresso_Grinder_Product_Brochure_DE.pdf"
    evidence_grade: B
    tag: fitted
    registry_refs:
      - psd.grinder.e65s.indicator_step
      - psd.grinder.e65s.d43_wet.gl1_4
      - psd.grinder.e65s.d43_wet.gl1_7
      - psd.grinder.e65s.d43_wet.gl2_0
    family: flat-traditional
    burr_diameter_mm: 65
    rpm: 1400
    dial:
      label: "grind level (10 indicators per unit)"
      min: 0
      max: 8
      default: 1.7
      ref: 1.4
      gap_at_ref_um: 195
      gap_per_unit_um: 25
      anchored: {min: 1.4, max: 2.0}

  - id: mahlkoenig-ek43
    name: Mahlkönig EK43 (coffee burrs)
    description: >-
      98 mm flat burrs at 1480 rpm with the stock coffee burrs. Espresso is typically ground at
      settings 1.0–2.5; extraction peaks near 1.7 (Cameron 2020). The dial is arbitrary (zero where the
      burrs chirp); its mapping is fitted to Cameron 2020's measured particle sizes.
    flags: []
    notes:
      - "Dial mapping fitted to Cameron 2020's laser-diffraction PSDs at settings 1.0–2.5 (X50 205–360 µm, dispersion not stated): an effective gap of 72 µm + 71 µm per unit, i.e. X50 ≈ 1.4 × (72 + 71 × setting) µm, within 6% of the measured medians. Fines: u_G = 16.1% (Q100 within 1.1 points)."
      - "Below setting 1.0 the mapping is extrapolated; at 0 (burrs chirping) it gives X50 ≈ 100 µm, the finest this grinder reaches in the model."
      - "Roast offset: at the same setting a dark roast grinds finer; light at 2.0 matched dark at 2.3 (Méndez Harper 2024). The bean model's roast factor (model.psd.roast_coefficient) reproduces this shift with this mapping."
    sources:
      - citation: "Cameron M.I., Morisco D., Hofstetter D., Uman E., Wilkinson J., Kennedy Z.C., Fontenot S.A., Lee W.T., Hendon C.H., Foster J.M. (2020) Systematically improving espresso: insights from mathematical modeling and experiment. Matter 2:631–648."
        doi: "10.1016/j.matt.2019.12.019"
        locator: "Fig. 2B (data/datasets/cameron2020-psd)"
      - citation: "Méndez Harper J. et al. (2024; online 2023) Moisture-controlled triboelectrification during coffee grinding. Matter 7:1–18."
        doi: "10.1016/j.matt.2023.11.005"
    evidence_grade: B
    tag: fitted
    registry_refs: [psd.grinder.ek43.dark_roast_mean_reduction, model.psd.roast_coefficient, model.psd.fines_weight_slope]
    family: flat-traditional
    burr_diameter_mm: 98
    rpm: 1480
    dial:
      label: "dial number"
      min: 0
      max: 16
      default: 1.7
      ref: 0
      gap_at_ref_um: 72
      gap_per_unit_um: 71
      anchored: {min: 1.0, max: 2.5}
    psd:
      fines_at_340_pct: 16.1

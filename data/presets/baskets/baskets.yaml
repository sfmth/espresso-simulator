# SPDX-License-Identifier: GPL-2.0-or-later
#
# Generic baskets, named by geometry rather than brand. Every dimension is an ESTIMATE of a typical
# basket of that kind (no basket drawings are in the research notes): inner wall profiles as
# [height above the floor, inner diameter] in mm, the diameter of the perforated field, and for
# pressurised (dual-wall) baskets the diameter of the single outlet orifice. Measure your own basket
# and describe it with recipe basket.custom for better results.
#
# Hole open area is left to the registry default (model.basket.open_area_fraction): at shot flows
# the holes add a negligible pressure drop, and the hole pattern acts through the edge multiplier
# (perforated vs floor diameter; model.basket.*, model.prep.edge_multiplier.*).
schema: puckworks.preset-file/1
kind: basket
description: Generic espresso baskets with estimated dimensions.
presets:
  # -- 58 mm precision (near-straight walls, small floor fillet) ---------------------------
  - id: 58-precision-15g
    name: 58 mm precision basket, 15 g
    description: Straight-walled 58 mm precision basket for 13–16 g doses.
    flags: [generic, estimated]
    notes:
      - "Basket dimensions are estimates of a typical 58 mm precision basket, not measurements."
    sources:
      - citation: "Puckworks input models (2026), docs/model/input-models.md: estimated basket dimensions."
    evidence_grade: D
    tag: estimated
    nominal_dose_g: 15
    dose_range_g: [13, 16]
    profile_mm: [[0, 54.0], [2, 57.0], [5, 58.0], [18, 58.5]]
    perforated_diameter_mm: 50


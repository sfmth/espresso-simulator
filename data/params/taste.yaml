schema: puckworks.parameters/1
description: M3 relative taste index conventions. Every coefficient is an explicit
  uncalibrated grade D estimate; primary sensory literature motivates directions and
  caveats, not these numerical values.
parameters:
- id: taste.acidity.reference_ta
  name: Acidity reference scale
  description: TA to pH 6.6 giving latent acidity one; an arbitrary display reference,
    not a sourness threshold.
  units: mol/m^3
  value: 20.0
  range:
    min: 0.001
    max: 1000.0
  tag: estimated
  evidence_grade: D
  sources:
  - citation: Puckworks M3 uncalibrated relative-index conventions (2026); all scales
      and weights are modelling assumptions, not sensory fits.
    url: https://github.com/sfmth/espresso-simulator/blob/main/docs/model/m3-taste.md
  research_note_ref: 02 §6
  used_by:
  - T
  status: draft
  conditions: M2 cup-chemistry reference temperature (25 C by default); relative comparisons
    only. No sensory panel calibration or validation.
- id: taste.bitterness.lactone_reference
  name: Lactone reference concentration
  description: Grouped mono- and di-lactone concentration giving latent bitterness
    one; no common family potency is established.
  units: kg/m^3
  value: 0.5
  range:
    min: 1.0e-06
    max: 100.0
  tag: estimated
  evidence_grade: D
  sources:
  - citation: Puckworks M3 uncalibrated relative-index conventions (2026); all scales
      and weights are modelling assumptions, not sensory fits.
    url: https://github.com/sfmth/espresso-simulator/blob/main/docs/model/m3-taste.md
  research_note_ref: 02 §6
  used_by:
  - T
  status: draft
  conditions: M2 cup-chemistry reference temperature (25 C by default); relative comparisons
    only. No sensory panel calibration or validation.
- id: taste.bitterness.phenylindane_reference
  name: Phenylindane reference concentration
  description: Grouped phenylindane concentration giving latent bitterness one; not
    a water detection threshold.
  units: kg/m^3
  value: 0.1
  range:
    min: 1.0e-06
    max: 100.0
  tag: estimated
  evidence_grade: D
  sources:
  - citation: Puckworks M3 uncalibrated relative-index conventions (2026); all scales
      and weights are modelling assumptions, not sensory fits.
    url: https://github.com/sfmth/espresso-simulator/blob/main/docs/model/m3-taste.md

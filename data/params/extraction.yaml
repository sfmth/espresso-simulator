        doi: "10.1016/j.matt.2019.12.019"
        locator: "value as tabulated by Lee 2023"
      - citation: "Grudeva Y., Moroney K.M., Foster J.M. (2026) A multiscale model for espresso brewing: asymptotic analysis and numerical simulation. Eur. J. Appl. Math. 37:496–519."
        doi: "10.1017/S095679252500018X"
      - citation: "Waszkiewicz R., Myck F., Białas Ł., Puciata-Mroczynska M., Dzikowski M., Szymczak P., Lisicki M. (2026) Under pressure: poroelastic regulation of flow in espresso brewing. Phys. Fluids 38:063113."
        doi: "10.1063/5.0319611"
    research_note_ref: "01 §5.5"
    used_by: [X]
    comment: >-
      212.4 kg/m³ (Cameron's model, via Lee 2023; Cameron's SI not read); 224 kg/m³ (Grudeva's model);
      fitted c₀ = 0.23–0.31 g/g (Schmieder). Prior: from 210 (just below the model values) to 350 kg/m³,
      the highest Schmieder c₀ (0.31 g/g ≈ 347 kg/m³): a surface-pool ceiling above every fitted outlet
      intercept would let the first fractions exceed anything measured. Waszkiewicz's first drops (about
      25% TDS ≈ 275 kg/m³, tanh amplitude 25.6 ± 1.3%) once set the upper bound at 280; they are held-out
      validation data (V4 first-fraction TDS) and are no longer used. Note 01 grades the row A/B; the
      weaker grade is recorded. Grudeva reports
      recipe-independent first-drip concentrations (unpublished experiments). In mass fraction the cap
      is ≈0.19–0.26 g/g, while Schmieder's fitted c₀ for TDS (0.23–0.31 g/g, 0.248 at the centre point)
      is ≈250–347 kg/m³ (≈268–278 at the centre point) [derived with the 1.08–1.12 g/mL extract density
      of 01 §4.10]: above the cap at its upper end. c₀ is the fitted intercept of an exponential decay
      in outlet concentration, not a pore concentration, so it can exceed c_sat; M1 calibration must
      treat the two consistently (fit c_sat against outlet data, not against c₀).
    status: draft


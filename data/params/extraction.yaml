    tag: fitted
    evidence_grade: A
    sources:
      - citation: "Jaganyi D., Vanmare J., Clark T. (1999) Kinetic study of mineral ion extraction from Kenyan Arabica coffee. J. Sci. Food Agric. 79:323–326."
        doi: "10.1002/(SICI)1097-0010(199902)79:2<323::AID-JSFA201>3.0.CO;2-E"
    research_note_ref: "01 §5.3"
    used_by: [X]
    comment: >-
      Hindrance factor 29. From a fitted infusion rate constant via k = 12D/r². Mn²⁺ in the same study:
      4.4×10⁻¹¹ m²/s (HF 48). Rate order K⁺ > caffeine > P > Mg²⁺ > Mn²⁺ (02 §3.1); anchors kinetic class
      K3.
    status: draft

  - id: extraction.diffusivity.phosphate.particle_80c
    name: Phosphate effective diffusivity in coffee particles at 80 °C
    symbol: D_eff
    description: Effective intraparticle diffusivity of H₂PO₄⁻ from batch infusion.
    units: "m^2/s"
    value: 1.09e-10
    range: {min: 0}
    conditions: 80 °C, batch infusion of Kenyan Arabica.
    tag: fitted
    evidence_grade: A
    sources:
      - citation: "Jaganyi D., Vanmare J., Clark T. (1999) Kinetic study of mineral ion extraction from Kenyan Arabica coffee. J. Sci. Food Agric. 79:323–326."
        doi: "10.1002/(SICI)1097-0010(199902)79:2<323::AID-JSFA201>3.0.CO;2-E"
    research_note_ref: "01 §5.3"
    used_by: [X]
    comment: Hindrance factor 24. From a fitted infusion rate constant via k = 12D/r².
    status: draft

  - id: extraction.diffusivity.lumped.corrochano_80c
    name: Lumped solubles effective diffusivity at 80 °C
    symbol: D_eff
    description: Single effective diffusivity fitted to whole extraction curves of total solubles in a stirred vessel.
    units: "m^2/s"
    value: 1.26e-10
    prior: {distribution: uniform, min: 1.9e-11, max: 1.6e-10}
    range: {min: 1.0e-16, max: 1.0e-7}
    conditions: 80 °C, stirred vessel; d43 basis; fine to coarse grinds.
    tag: fitted
    evidence_grade: A
    sources:
      - citation: "Roman Corrochano B. (2017) Advancing the engineering understanding of coffee extraction. EngD thesis, University of Birmingham."
        url: "https://etheses.bham.ac.uk/id/eprint/7176/"
    research_note_ref: "01 §5.3"
    used_by: [X]
    comment: >-
      1.9×10⁻¹¹ (fine grind) to 1.6×10⁻¹⁰ on a d43 basis (up to 2.1×10⁻¹⁰ on a coarse-peak basis);
      1.26×10⁻¹⁰ pooled. Other lumped fits: 0.8–1.1×10⁻¹⁰ (70–85 °C, Voilley & Simatos 1979, via
      Corrochano; the thesis prints this once as ×10⁻¹¹) and 6.0×10⁻¹³–4.2×10⁻¹² (90 °C, late-time fit,
      Zanoni 1992, via Corrochano). Four diffusivity classes fit whole curves better (5–8% error) than one
      coefficient (6–17%), and the apparent value depends on which part of the curve is weighted.
    status: draft

  - id: extraction.diffusivity.mw_class.low
    name: Effective diffusivity, low molecular weight (caffeine-like) class, 80 °C
    symbol: D_eff

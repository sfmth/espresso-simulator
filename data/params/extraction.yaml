# SPDX-License-Identifier: GPL-2.0-or-later
schema: puckworks.parameters/1
description: >-
  Extraction (module X): dispersion, intraparticle diffusivities, partition, saturation, maximum
  yield, surface and kernel timescales, and surface-rate constants. Transcribed from research note 01
  §3, §4.8, §5 and §8.

parameters:
  # -- Dispersion ----------------------------------------------------------------
  - id: extraction.dispersion.bodenstein
    name: Bodenstein number of the bed
    symbol: Bo
    description: Ratio vL/D_ax of advection to axial dispersion in the bed, from tracer residence-time distributions.
    units: "1"
    prior: {distribution: uniform, min: 7.7, max: 16.8}
    range: {min: 0}
    conditions: KCl tracer at 22 °C; espresso beds of three PSDs.
    tag: measured
    evidence_grade: A
    sources:
      - citation: "Vaca Guerra M., Harshe Y.M., Fries L., Payan Lozada J., Atxutegi A., Palzer S., Heinrich S. (2024) Modeling the extraction of espresso components as dispersed flow through a packed bed. J. Food Eng. 368:111913."
        doi: "10.1016/j.jfoodeng.2023.111913"
    research_note_ref: "01 §4.8"
    used_by: [X]
    comment: >-
      16.8 in the dry initial state, 8.7–10.4 after 30 g and 7.7 after 60 g, so dispersion grows with
      extraction; mean residence times are ~5× plug flow. This contradicts the negligible-dispersion
      assumption of Cameron and Grudeva. Tracer data exist only at 22 °C (note 01, open question 7).
    status: draft

  - id: extraction.dispersion.axial_coefficient
    name: Axial dispersion coefficient
    symbol: D_ax
    description: Axial dispersion coefficient of solutes in the bed liquid.
    units: "m^2/s"
    value: 5.0e-6
    prior: {distribution: uniform, min: 1.0e-6, max: 1.0e-5}
    range: {min: 0, max: 1.0e-3}
    relation:
      derived_from:
        - extraction.dispersion.bodenstein
        - bed.height.waszkiewicz_18g5
        - shot.flow_rate
        - bed.basket.area_58mm
        - bed.porosity.intergranular
      formula: >-
        D_ax = v L / Bo, with interstitial velocity v = Q/(A ε) of 2–6 mm/s and L ≈ 14 mm; for example
        3.6 mm/s × 14 mm / 10 ≈ 5×10⁻⁶ m²/s
    conditions: Hot espresso beds assumed to disperse like the 22 °C tracer experiments.
    tag: derived
    evidence_grade: C
    sources:
      - citation: "Vaca Guerra M., Harshe Y.M., Fries L., Payan Lozada J., Atxutegi A., Palzer S., Heinrich S. (2024) Modeling the extraction of espresso components as dispersed flow through a packed bed. J. Food Eng. 368:111913."
        doi: "10.1016/j.jfoodeng.2023.111913"
    research_note_ref: "01 §4.8"
    used_by: [X]
    comment: >-
      Derived in note 01 §4.8 from the measured Bo ≈ 8–17: "about 10⁻⁶–10⁻⁵ m²/s", ≈5×10⁻⁶ at Bo = 10.
      Over Bo = 7.7–16.8 and v = 2–6 mm/s, vL/Bo spans 1.7×10⁻⁶–1.1×10⁻⁵ m²/s [derived here]. Grudeva's
      1×10⁻⁸ m²/s (extraction.dispersion.grudeva2026) is a model assumption that the tracer data
      contradict; molecular diffusion (~10⁻⁹ m²/s) is the physical floor. Grade: weakest input
      (intergranular porosity, C, which sets v).
    status: draft

  - id: extraction.dispersion.grudeva2026
    name: Liquid-phase effective diffusivity (Grudeva 2026)
    symbol: D_eff
    description: Effective diffusivity of solutes in the bed liquid assumed in the Grudeva, Moroney & Foster model (their axial dispersion).
    units: "m^2/s"
    value: 1.0e-8
    range: {min: 0}
    tag: estimated
    evidence_grade: B
    sources:
      - citation: "Grudeva Y., Moroney K.M., Foster J.M. (2026) A multiscale model for espresso brewing: asymptotic analysis and numerical simulation. Eur. J. Appl. Math. 37:496–519."
        doi: "10.1017/S095679252500018X"
        locator: "Table 1"
    research_note_ref: "01 §3.5"
    used_by: [X]
    comment: >-
      Part of the Grudeva literature set (2-class mode). An assumption contradicted by tracer data,
      which imply 10⁻⁶–10⁻⁵ m²/s (extraction.dispersion.axial_coefficient); use it only to reproduce the
      paper.
    status: draft

  # -- Diffusivities -------------------------------------------------------------
  - id: extraction.diffusivity.caffeine.water_80c
    name: Caffeine diffusivity in water at 80 °C
    symbol: D_aq
    description: Molecular diffusivity of caffeine in water at 80 °C.
    units: "m^2/s"
    prior: {distribution: uniform, min: 1.89e-9, max: 2.2e-9}
    range: {min: 0}
    conditions: 80 °C
    tag: measured
    evidence_grade: C
    sources:
      - citation: "Jaganyi D., Vanmare J., Clark T. (1999) Kinetic study of mineral ion extraction from Kenyan Arabica coffee. J. Sci. Food Agric. 79:323–326."
        doi: "10.1002/(SICI)1097-0010(199902)79:2<323::AID-JSFA201>3.0.CO;2-E"
        locator: "citing Price et al."
      - citation: "Roman Corrochano B. (2017) Advancing the engineering understanding of coffee extraction. EngD thesis, University of Birmingham."
        url: "https://etheses.bham.ac.uk/id/eprint/7176/"
        locator: "citing Poling"
    research_note_ref: "01 §5.3"
    used_by: [X]
    comment: >-
      2.2×10⁻⁹ (Jaganyi 1999, citing Price et al.), 1.89×10⁻⁹ (Corrochano 2017, citing Poling), ~2×10⁻⁹
      (Ellero 2019); note 01 §8 rounds the range to 1.9–2.2×10⁻⁹. Secondary citations of handbook-type
      values, hence grade C.
      With a hindrance factor HF, D_eff = D_aq/HF (01 §5.4).
    status: draft

  - id: extraction.diffusivity.caffeine.particle_80c
    name: Caffeine effective diffusivity in coffee particles at 80 °C
    symbol: D_eff
    description: Effective intraparticle diffusivity of caffeine from batch infusion of sieved coffee.
    units: "m^2/s"
    value: 1.90e-10
    prior: {distribution: uniform, min: 1.58e-10, max: 2.05e-10}
    range: {min: 1.0e-16, max: 1.0e-7}
    conditions: 80 °C; 1.7–2.0 mm particles (Jaganyi 1999); five medium-roast origins (Jaganyi & Madlala 2000).
    tag: fitted
    evidence_grade: A
    sources:
      - citation: "Jaganyi D., Vanmare J., Clark T. (1999) Kinetic study of mineral ion extraction from Kenyan Arabica coffee. J. Sci. Food Agric. 79:323–326."
        doi: "10.1002/(SICI)1097-0010(199902)79:2<323::AID-JSFA201>3.0.CO;2-E"
      - citation: "Jaganyi D., Madlala S.P. (2000) Kinetics of coffee infusion: mineral ions and caffeine from several medium-roasted coffees. J. Sci. Food Agric. 80:85–90."
        doi: "10.1002/(SICI)1097-0010(20000101)80:1<85::AID-JSFA489>3.0.CO;2-#"
        locator: "values via Corrochano 2017"
    research_note_ref: "01 §5.3"
    used_by: [X]
    comment: >-
      Jaganyi 1999: 1.90×10⁻¹⁰ (hindrance factor 12) from k_obs = 2.67×10⁻³ s⁻¹ with k = 12D/r².
      Jaganyi & Madlala 2000: 1.58–2.05×10⁻¹⁰ (HF 11–14). Spiro & Chong 1997: HF 11.1 at 80 °C and 29.7
      at 25.5 °C. Note 01 §8 rounds the range to 1.6–2.1×10⁻¹⁰. PLAN §8 lists these as measured
      transport data; the diffusivity itself comes from a fitted rate constant via k = 12D/r², the
      same basis as the other particle diffusivities, hence tagged fitted.
    status: draft

  - id: extraction.hindrance_factor.microstructural
    name: Microstructural hindrance factor
    symbol: HF
    description: >-
      Ratio of aqueous to effective intraparticle diffusivity estimated from the particle
      microstructure, HF ≈ τ_p/ε_p, so that D_eff = D_aq/HF.
    units: "1"
    prior: {distribution: uniform, min: 7.6, max: 13.6}
    range: {min: 1}
    relation:
      derived_from: [bed.tortuosity.particle, bed.porosity.intraparticle]
      formula: "HF ≈ τ_p/ε_p, so that D_eff = D_aq/HF"
    tag: derived
    evidence_grade: B
    sources:
      - citation: "Roman Corrochano B. (2017) Advancing the engineering understanding of coffee extraction. EngD thesis, University of Birmingham."
        url: "https://etheses.bham.ac.uk/id/eprint/7176/"
    research_note_ref: "01 §5.4"
    used_by: [X]
    comment: >-
      Measured hindrance factors at 80 °C: caffeine 11–14, K⁺ 16, H₂PO₄⁻ 24, Mg²⁺ 29, Mn²⁺ 48 (Jaganyi
      1999; 01 §5.3). Grade: note 01 §5.3 grades Corrochano's microstructure-based estimates B, which
      is the note's own grade for this derivation.
    status: draft

  - id: extraction.diffusivity.potassium.particle_80c
    name: Potassium effective diffusivity in coffee particles at 80 °C
    symbol: D_eff
    description: Effective intraparticle diffusivity of K⁺ from batch infusion.
    units: "m^2/s"
    value: 3.15e-10
    range: {min: 0}
    conditions: 80 °C, batch infusion of Kenyan Arabica.
    tag: fitted
    evidence_grade: A
    sources:
      - citation: "Jaganyi D., Vanmare J., Clark T. (1999) Kinetic study of mineral ion extraction from Kenyan Arabica coffee. J. Sci. Food Agric. 79:323–326."
        doi: "10.1002/(SICI)1097-0010(199902)79:2<323::AID-JSFA201>3.0.CO;2-E"
    research_note_ref: "01 §5.3"
    used_by: [X]
    comment: >-
      Hindrance factor 16. From a fitted infusion rate constant via k = 12D/r². Highest particle
      diffusivity measured; anchors kinetic class K1 (02 §3.2).
    status: draft

  - id: extraction.diffusivity.magnesium.particle_80c
    name: Magnesium effective diffusivity in coffee particles at 80 °C
    symbol: D_eff
    description: Effective intraparticle diffusivity of Mg²⁺ from batch infusion.
    units: "m^2/s"
    value: 7.0e-11
    range: {min: 0}

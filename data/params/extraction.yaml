  - id: extraction.diffusivity.mw_class.very_high
    name: Effective diffusivity, very high molecular weight class, 80 °C
    symbol: D_eff
    description: Intraparticle diffusivity of the very-high-MW class (reported as 22–24 kDa), estimated from the particle microstructure.
    units: "m^2/s"
    prior: {distribution: uniform, min: 0.6e-12, max: 1.6e-12}
    range: {min: 0}
    relation:
      derived_from: [extraction.hindrance_factor.microstructural]
      formula: "D_eff = D_aq/HF, with D_aq of the class from Stokes–Einstein (Corrochano 2017)"
    conditions: 80 °C
    tag: derived
    evidence_grade: B
    sources:
      - citation: "Roman Corrochano B. (2017) Advancing the engineering understanding of coffee extraction. EngD thesis, University of Birmingham."
        url: "https://etheses.bham.ac.uk/id/eprint/7176/"
    research_note_ref: "01 §5.3"
    used_by: [X]
    comment: >-
      The fraction was sized by DLS (bulk D 7.7–8.5×10⁻¹² m²/s); a diffusivity this low implies a
      hydrodynamic radius of order 100 nm, i.e. aggregates rather than 22–24 kDa molecules [derived,
      01 §5.4].
    status: draft

  - id: extraction.diffusivity.fitted.cameron2020
    name: Espresso-model diffusivity fitted by Cameron et al. 2020
    symbol: D_s
    description: Intragranular diffusivity fitted with a homogenized multiscale model to café espresso data.
    units: "m^2/s"
    value: 6.25e-10
    range: {min: 0}
    conditions: EK43 grind series, 6 bar, 92 °C, 20 g in / 40 g out.
    tag: fitted
    evidence_grade: B
    sources:
      - citation: "Cameron M.I., Morisco D., Hofstetter D., Uman E., Wilkinson J., Kennedy Z.C., Fontenot S.A., Lee W.T., Hendon C.H., Foster J.M. (2020) Systematically improving espresso: insights from mathematical modeling and experiment. Matter 2:631–648."
        doi: "10.1016/j.matt.2019.12.019"
    research_note_ref: "01 §3.4"
    used_by: [X]
    comment: >-
      Espresso-model fits (6×10⁻¹⁰ to 10⁻⁹) sit above immersion-measured intraparticle values
      (10⁻¹¹–10⁻¹⁰); they probably absorb surface washout and heterogeneity, so they are not physical
      diffusivities (01 §5.3). Use with the matching closure (2-class literature mode).
    status: draft

  - id: extraction.diffusivity.fitted.grudeva2026
    name: Espresso-model diffusivity of Grudeva et al. 2026
    symbol: D_s
    description: Intragranular diffusivity (D_sf = D_sb) in the parameter table of the Grudeva, Moroney & Foster model.
    units: "m^2/s"
    value: 1.0e-9
    range: {min: 0}
    tag: estimated
    evidence_grade: B
    sources:
      - citation: "Grudeva Y., Moroney K.M., Foster J.M. (2026) A multiscale model for espresso brewing: asymptotic analysis and numerical simulation. Eur. J. Appl. Math. 37:496–519."
        doi: "10.1017/S095679252500018X"
        locator: "Table 1"
    research_note_ref: "01 §3.5"
    used_by: [X]
    comment: >-
      Part of the Grudeva literature set. Note 01 §5.3 lists it among model-fitted espresso values, but
      the paper validated only against its own numerics (time-resolved data are promised), so it is
      tagged estimated like the other Grudeva parameters; same caveat as the Cameron fit.
    status: draft

  - id: extraction.diffusivity.temperature_coefficient
    name: Temperature coefficient of diffusivity
    description: Fractional change of intraparticle diffusivity per kelvin near brew temperature (Stokes–Einstein, D ∝ T/μ).
    units: "%/K"
    value: 1.5
    range: {min: 0}
    relation:
      derived_from: [hydraulics.viscosity.water_80c, hydraulics.viscosity.water_95c]
      formula: >-
        D ∝ T/μ (Stokes–Einstein): (368.15/353.15) × (0.354/0.298) = 1.24 from 80 to 95 °C, about 1.5%
        per kelvin
    conditions: 80–96 °C
    tag: derived
    evidence_grade: C
    sources:
      - citation: "CRC Handbook of Chemistry and Physics: standard values for the viscosity of water, as quoted in research note 01 §4.10."
      - citation: "Roman Corrochano B. (2017) Advancing the engineering understanding of coffee extraction. EngD thesis, University of Birmingham."
        url: "https://etheses.bham.ac.uk/id/eprint/7176/"
        locator: "Table 5.6"
    research_note_ref: "01 §5.4"
    used_by: [X]
    comment: >-
      "About 1.5% per °C is an adequate default" over 80–96 °C (note 01). Stokes–Einstein factors: 1.24
      from 80 to 95 °C [derived]. Measured lumped ratios differ: ×1.3 for 80 vs 50 °C (×1.7 predicted)
      and ×9.3 for 80 vs 20 °C (×3.5 predicted) (Corrochano Table 5.6). Caffeine's infusion rate
      constant rises 8× from 25.8 to 84.1 °C (≈32 kJ/mol [derived], Spiro & Selwood 1984; 02 Table 2).
    status: draft

  # -- Partition, saturation, initial content, maximum yield -------------------
  - id: extraction.partition.lumped_50c
    name: Partition coefficient of lumped solubles at 50 °C
    symbol: K
    description: >-
      Equilibrium ratio K = C_b/C_s of the solute concentration in the bulk liquid to the solute per unit
      volume of the swollen particles (pore solution and matrix-bound solute together), for lumped
      solubles. Not the ratio to the particles' pore-liquid concentration, which is C_s/ε_p if all the
      solute is in solution.
    units: "1"
    value: 0.57
    range: {min: 0.01, max: 5}
    conditions: 50 °C; swelling factor assumed 1.
    tag: measured
    evidence_grade: A
    sources:
      - citation: "Roman Corrochano B. (2017) Advancing the engineering understanding of coffee extraction. EngD thesis, University of Birmingham."
        url: "https://etheses.bham.ac.uk/id/eprint/7176/"
        locator: "§3.3.13, Eq. 3.15–3.17 (pp. 82–83); Table 4.10 (p. 154)"
    research_note_ref: "01 §5.5"
    used_by: [X]
    comment: >-
      Same series gives 0.42 at 20 °C and 0.61 at 80 °C. Definition and range as for
      extraction.partition.lumped_80c.
    status: draft

  - id: extraction.partition.lumped_80c
    name: Partition coefficient of lumped solubles at 80 °C
    symbol: K
    description: >-
      Equilibrium ratio K = C_b/C_s of the solute concentration in the bulk liquid to the solute per unit
      volume of the swollen particles (pore solution and matrix-bound solute together), for lumped
      solubles. Not the ratio to the particles' pore-liquid concentration, which is C_s/ε_p if all the
      solute is in solution.
    units: "1"
    value: 0.61
    range: {min: 0.01, max: 5}
    conditions: 80 °C; swelling factor assumed 1.
    tag: measured
    evidence_grade: A
    sources:
      - citation: "Roman Corrochano B. (2017) Advancing the engineering understanding of coffee extraction. EngD thesis, University of Birmingham."
        url: "https://etheses.bham.ac.uk/id/eprint/7176/"
        locator: "§3.3.13, Eq. 3.15–3.17 (pp. 82–83); Table 4.10 (p. 154)"
    research_note_ref: "01 §5.5"
    used_by: [X]
    comment: >-
      The highest measured temperature, closest to brewing. Definition (Eq. 3.15): K = (C_b/C_s)_eq, with
      C_s the concentration "inside the solid", which "encompasses" solute in the pore solution and solute
      still attached to the matrix. K comes from the equilibrium mass balance y₀m = C_b V_b + C_s V_s
      (Eq. 3.16), with V_s the particles' volume after extraction, m·S/ρ_particle (Eq. 3.17, swelling
      factor S = 1), so C_s is solute per particle envelope volume. A model whose kernel concentration u is
      per pore-liquid volume (intraparticle porosity ε_p) needs u_surface = c/(K·ε_p) at equilibrium, i.e. a
      pore-basis coefficient K·ε_p (0.34 with ε_p = 0.55), if no solute stays bound to the matrix. PLAN
      §7.3 X uses K ≈ 0.42–0.61. A different immersion "equilibrium constant" (E = K·E_max) of
      0.717 ± 0.007, insensitive to 80–99 °C, was reported by Liang 2021. Range: at most 5, eight times
      the highest lumped value and five times caffeine's ≈1, the largest reported for a coffee solute;
      much larger K would make the kernel's equilibrium loading exceed what its pores can hold (the shot
      solver rejects K ≥ 8.4 at the defaults).
    status: draft

  - id: extraction.partition.caffeine
    name: Partition coefficient of caffeine
    symbol: K
    description: >-
      Equilibrium ratio K = C_b/C_s of the solute concentration in the bulk liquid to the solute per unit
      volume of the swollen particles (pore solution and matrix-bound solute together), for caffeine. Not
      the ratio to the particles' pore-liquid concentration, which is C_s/ε_p if all the solute is in
      solution.

# SPDX-License-Identifier: GPL-2.0-or-later
schema: puckworks.parameters/1
description: >-
  Espresso extraction kinetics of the four measured species (Schmieder et al. 2023): outlet
  concentration c(m) = c₀ exp(−m/λ) against cumulative beverage mass m, at the centre point of their
  design, with priors spanning all 15 design conditions. Transcribed from research note 02 §3.1
  (Table 5) and 01 §5.5; full-precision values with standard errors are in
  data/datasets/schmieder2023-centre-point.

parameters:
  - id: kinetics.schmieder2023.lambda.trigonelline
    name: Characteristic beverage mass of trigonelline
    symbol: λ
    description: Beverage mass over which the outlet concentration of trigonelline falls by a factor e.
    units: g
    value: 16.1
    prior: {distribution: uniform, min: 13.1, max: 16.6}
    range: {min: 0}
    conditions: >-
      Decent DE1 Pro, flow control, 20 g dose, Mahlkönig E65S. Value: design centre point (2 mL/s,
      GL 1.7, 89 °C). Prior: all 15 conditions (1–3 mL/s, GL 1.4–2.0, 80–98 °C).
    tag: fitted
    evidence_grade: A
    sources:
      - citation: "Schmieder B.K.L., Pannusch V.B., Vannieuwenhuyse L., Briesen H., Minceva M. (2023) Influence of flow rate, particle size, and temperature on espresso extraction kinetics. Foods 12:2871."
        doi: "10.3390/foods12152871"
        locator: "Table A1 (Exp. 7 is the centre point)"
    research_note_ref: "02 §3.1"
    used_by: [X, C]
    licence_note: "Schmieder 2023 is CC BY 4.0: derived parameters may be bundled with attribution (PLAN §11)."
    comment: >-
      λ/dose = 0.80, kinetic class K1 (02 §3.2). Faster flow lowers c₀ and raises λ. Table A1 prints
      16.08737 g at the centre point; note 02 rounds to 16.1.
    status: draft


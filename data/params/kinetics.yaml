  - id: kinetics.schmieder2023.c0.tds
    name: Initial outlet TDS
    symbol: c₀
    description: Extrapolated outlet mass fraction of dissolved solids at zero beverage mass.
    units: "g/g"
    value: 0.248
    prior: {distribution: uniform, min: 0.23, max: 0.31}
    range: {min: 0, max: 1}
    conditions: >-
      Value: design centre point (2 mL/s, GL 1.7, 89 °C), 20 g dose. Prior: all 15 design conditions
      (01 §5.5).
    tag: fitted
    evidence_grade: A
    sources:
      - citation: "Schmieder B.K.L., Pannusch V.B., Vannieuwenhuyse L., Briesen H., Minceva M. (2023) Influence of flow rate, particle size, and temperature on espresso extraction kinetics. Foods 12:2871."
        doi: "10.3390/foods12152871"
        locator: "Table A1"
    research_note_ref: ["02 §3.1", "01 §5.5"]
    used_by: [X, C]
    licence_note: "Schmieder 2023 is CC BY 4.0: derived parameters may be bundled with attribution (PLAN §11)."
    comment: >-
      Table A1 prints 0.24827 g/g at the centre point. In kg/m³ (extract density 1.08–1.12 g/mL, 01 §4.10)
      the centre point is ≈268–278 and the prior ≈250–347 kg/m³ [derived], so its upper end exceeds the
      lumped saturation cap of 210–280 kg/m³ (extraction.saturation.lumped). That is not a contradiction:
      c₀ is the fitted intercept at zero beverage mass of an exponential decay in outlet concentration,
      not a pore concentration, and the first drops may deviate from the exponential (the authors add the
      first fraction separately). M1 calibration must treat c₀ and c_sat consistently, fitting c_sat to
      outlet concentrations rather than equating it with c₀. Compare the first-drop TDS of about 25% in
      Waszkiewicz 2026 (01 §5.5).
    status: draft

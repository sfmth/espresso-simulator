schema: puckworks.parameters/1
description: M2 source-water, effective acid buffering and cup observation assumptions.
  Unmeasured defaults remain explicit estimates.
parameters:
- id: water.default.alkalinity_mg_l_caco3
  name: Alkalinity mg l caco3
  description: Illustrative source-water default; replace with a measured alkalinity
    mg l caco3. This is not a required water specification.
  units: mg/L
  value: 40
  range:
    min: 0
    max: 500
  tag: estimated
  evidence_grade: D
  sources:
  - &id001
    citation: Puckworks M2 cup-chemistry closure assumptions (2026), docs/model/m2-chemistry.md;
      illustrative, not fitted to V7.
    url: https://github.com/sfmth/espresso-simulator/blob/main/docs/model/m2-chemistry.md
  research_note_ref: 02 §5
  used_by:
  - W
  - C
  status: draft
  conditions: M2 cup observations at 25 C unless an explicit measurement setting says
    otherwise; estimates are not calibration results.

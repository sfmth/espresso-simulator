schema: puckworks.parameters/1
description: M3 deliberately illustrative input scenario supports. These are not fitted
  distributions or calibrated confidence intervals.
parameters:
- id: uncertainty.unknown.psd_scale_relative
  name: Unknown psd scale relative
  description: Common multiplicative particle diameter half-width; all PSD bins share
    one factor. Scenario support is a modelling judgement, not an empirical confidence
    interval.
  units: '1'
  value: 0.25
  range:
    min: 0
    max: 0.95
  tag: estimated
  evidence_grade: D
  sources:
  - citation: Puckworks M3 input uncertainty scenario assumptions (2026), docs/model/m3-uncertainty.md;
      illustrative supports, not calibrated coverage.
    url: https://github.com/sfmth/espresso-simulator/blob/main/docs/model/m3-uncertainty.md
  research_note_ref: 02 Open questions
  used_by:
  - T
  status: draft
  conditions: Bounded independent uniform latent draws except the explicitly shared
    PSD and water factors; unknown and measured describe knowledge states selected
    by the user.

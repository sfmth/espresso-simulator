- id: chemistry.process.anaerobic_acetic_multiplier
  name: 'Anaerobic process: acetic-acid multiplier'
  description: Estimated relative acetic-acid inventory after anaerobic processing. Direction follows reports
    of increased acids with extended fermentation; the 1.5 multiplier is a broad scenario assumption, not a
    quantitative result transferable across lots.
  units: '1'
  value: 1.5
  range:
    min: 0
    max: 10
  tag: estimated
  evidence_grade: D
  sources:
  - citation: da Silva Vale A. et al. (2022) Foods 12:37; self-induced anaerobic fermentation of coffee.
    doi: 10.3390/foods12010037
  - *id004
  research_note_ref: 02 §4.2
  used_by:
  - B
  - X
  - C
  status: draft
  prior:
    distribution: uniform
    min: 0.5
    max: 3
- id: chemistry.storage.aroma_half_life
  name: Generic whole-bean aroma half-life in sealed storage

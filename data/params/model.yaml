  # -- Thermal (lumped node; module H) ---------------------------------------------------
  - id: model.thermal.hardware_water_equivalent
    name: Water-equivalent mass of basket and portafilter
    description: >-
      Heat capacity of the basket and the part of the portafilter that exchanges heat during a shot,
      expressed as the mass of water with the same heat capacity (multiply by 4.186 J/(g K)).
    units: g
    value: 30
    prior: {distribution: uniform, min: 10, max: 80}
    range: {min: 1, max: 1000}
    tag: estimated
    evidence_grade: D
    sources:
      - citation: "Puckworks input models (2026), docs/model/input-models.md: model assumption, to be calibrated."
    research_note_ref: "01 §7"
    used_by: [M, H]
    comment: >-
      Note 01 §7 recommends one lumped node for basket and portafilter with a calibrated exchange; no
      thermal masses are published there. 30 g of water ≈ 125 J/K, e.g. a 35 g steel basket plus part of
      a brass portafilter. (Stored as a water mass because the unit vocabulary has no J/K.)
    status: draft

  - id: model.thermal.coffee_heat_capacity_ratio
    name: Specific heat of coffee relative to water
    description: Specific heat capacity of the dry grounds divided by that of water.
    units: "1"
    value: 0.35
    prior: {distribution: uniform, min: 0.24, max: 0.45}
    range: {min: 0, max: 1}
    tag: estimated
    evidence_grade: D
    sources:
      - citation: "Puckworks input models (2026), docs/model/input-models.md: model assumption, to be calibrated."
    research_note_ref: "01 §7"
    used_by: [B, H]
    comment: >-
      Green-bean estimates of ~1.0–1.9 kJ/(kg K) appear in secondary sources [unverified]; no roasted,
      ground value was verified (01 §7). 0.35 ≈ 1.47 kJ/(kg K).
    status: draft

  - id: model.thermal.loss_time_constant
    name: Cooling time constant of basket and portafilter
    description: >-
      Time constant with which the lumped basket-and-portafilter node would cool to the room if no water
      flowed; the heat-loss coefficient is the node's heat capacity divided by this time.
    units: s
    value: 300
    prior: {distribution: uniform, min: 100, max: 900}
    range: {min: 10, max: 100000}
    tag: estimated
    evidence_grade: D
    sources:
      - citation: "Puckworks input models (2026), docs/model/input-models.md: model assumption, to be calibrated."
    research_note_ref: "01 §7"
    used_by: [M, H]
    comment: >-
      No measurement in the notes. Stored as a time constant because the unit vocabulary has no W/K.
      During a 30 s shot the loss is small either way.
    status: draft

  - id: model.thermal.hardware_temperature
    name: Basket and portafilter temperature at the start of a shot

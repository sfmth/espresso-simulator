    comment: >-
      Machine-specific and unpublished in the notes. The basket volume above the bed is added separately
      (solver); this is only the gap above the rim.
    status: draft

  - id: model.machine.drip_time_constant
    name: Post-stop drip time constant
    description: >-
      Time constant with which the water left above the puck drains into the cup after the pump stops,
      when a machine does not state it (the solver drains only the headspace water; a machine with a
      three-way valve, vent_headspace, has no drip).
    units: s
    value: 1.5
    prior: {distribution: uniform, min: 0.5, max: 5}
    range: {min: 0, max: 60}
    tag: estimated
    evidence_grade: D
    sources:
      - citation: "Puckworks input models (2026), docs/model/input-models.md: model assumption, to be calibrated."
    research_note_ref: "01 §8"
    used_by: [M]
    comment: >-
      No research note covers the post-stop drip. Machines with a three-way valve vent the group and do
      not drip (vent_headspace); machines without one drain the headspace water through the puck.
      Calibrate against the scale reading after the stop. The range ends at the solver's 60 s bound.
    status: draft

  - id: model.stop.default_ratio
    name: Default brew ratio
    description: Beverage mass per dry dose used as the stop rule when a recipe gives neither a beverage mass nor a time.
    units: "1"
    value: 2
    prior: {distribution: uniform, min: 1, max: 3}
    range: {min: 0.5, max: 10}
    tag: estimated
    evidence_grade: C
    sources:
      - citation: "Cameron M.I., Morisco D., Hofstetter D., Uman E., Wilkinson J., Kennedy Z.C., Fontenot S.A., Lee W.T., Hendon C.H., Foster J.M. (2020) Systematically improving espresso: insights from mathematical modeling and experiment. Matter 2:631–648."
        doi: "10.1016/j.matt.2019.12.019"
    research_note_ref: "01 §8"
    used_by: [M]

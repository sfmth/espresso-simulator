  # -- Bean model (module B) ------------------------------------------------------------
  - id: model.bean.intraparticle_porosity_medium
    name: Intraparticle porosity of a medium roast
    symbol: ε_p
    description: Intraparticle porosity of espresso grounds of a medium roast (roast level 0.5), the reference of the bean model.
    units: "1"
    value: 0.55
    prior: {distribution: uniform, min: 0.47, max: 0.65}
    range: {min: 0.3, max: 0.7}
    relation:
      derived_from: [bed.density.bulk, bed.porosity.intergranular, bed.density.skeletal]
      formula: >-
        ε_p = 1 − ρ_bed/((1 − ε) ρ_s) = 1 − 500/(0.83 × 1352) = 0.554, so that the registry's typical
        intergranular porosity (0.17) and skeletal density (central 1352 kg/m³) reproduce the measured
        bulk density of a 58 mm puck (≈500 kg/m³)
    tag: derived
    evidence_grade: C
    sources:
      - citation: "Waszkiewicz R., Myck F., Białas Ł., Puciata-Mroczynska M., Dzikowski M., Szymczak P., Lisicki M. (2026) Under pressure: poroelastic regulation of flow in espresso brewing. Phys. Fluids 38:063113."
        doi: "10.1063/5.0319611"
      - citation: "Roman Corrochano B. (2017) Advancing the engineering understanding of coffee extraction. EngD thesis, University of Birmingham."
        url: "https://etheses.bham.ac.uk/id/eprint/7176/"
    research_note_ref: "01 §4.4"
    used_by: [B, P]
    comment: >-
      Consistent with the espresso-grind measurements 0.50–0.57 (Hg + He, Corrochano) and 0.56 (Moroney
      2019). The registry's generic prior (bed.porosity.intraparticle, 0.35–0.65) also covers boulder
      values; overriding that id replaces the bean model's value. Grade: weakest input (C).
    status: draft


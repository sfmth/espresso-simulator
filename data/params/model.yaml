# SPDX-License-Identifier: GPL-2.0-or-later
#
# Model parameters of the M1 input models (crates/puckmodel; docs/model/input-models.md) that the
# research registry does not provide: closure coefficients, conventions, defaults for gear that is
# described only partly, and a few values derived from other records.
#
# Honesty rules for this file:
#   - a judgement is tagged `estimated` with grade D, a deliberately wide prior and a comment saying
#     what evidence bounds it, even when that evidence is itself graded higher;
#   - a value computed from other records is tagged `derived` and names them in `relation`;
#   - no research note covers pump curves, post-stop drip or group thermal masses; those records point
#     at the note section their values must be consistent with, and say so in the comment.
# Calibration (PLAN §7.3 K; data/calibration/current.yaml) is expected to replace most of them.
schema: puckworks.parameters/1
description: >-
  M1 input-model parameters (grinder model G, bean model B, bed builder P, machine model M, and the
  closures they hand to hydraulics H and extraction X) that the research registry lacks. Mostly
  estimates with wide priors; see docs/model/input-models.md.

parameters:
  # -- Grinder -> PSD (module G) -------------------------------------------------------
  - id: model.psd.fines_log_width
    name: Log-width of the fines mode
    symbol: σ_f
    description: Standard deviation of ln(diameter) of the fines component of the three-component log-normal PSD mixture.
    units: "1"
    value: 0.6
    prior: {distribution: uniform, min: 0.4, max: 0.8}
    range: {min: 0.2, max: 1.2}
    tag: estimated
    evidence_grade: D
    sources:
      - citation: "Puckworks input models (2026), docs/model/input-models.md: model assumption, to be calibrated."
      - citation: "Roman Corrochano B. (2017) Advancing the engineering understanding of coffee extraction. EngD thesis, University of Birmingham."
        url: "https://etheses.bham.ac.uk/id/eprint/7176/"
    research_note_ref: ["03 §1.1", "03 Implications A"]
    used_by: [G]
    comment: >-
      Chosen so that the fines component (mode 40 µm, psd.fines_mode) spans about 12–130 µm at ±2σ and
      puts about 94% of its volume below 100 µm, matching a 40–50 µm volume peak with a trough near
      100 µm (03 §1.1). No published fit of the mixture width was accessible (Gagné 2023 shows the
      trends only as figures, 03 §1.5).
    status: draft

  - id: model.psd.boulder_log_width
    name: Log-width of the boulder tail
    symbol: σ_b
    description: Standard deviation of ln(diameter) of the boulder-tail component of the three-component log-normal PSD mixture.
    units: "1"
    value: 0.35
    prior: {distribution: uniform, min: 0.2, max: 0.5}
    range: {min: 0.1, max: 0.8}
    tag: estimated
    evidence_grade: D
    sources:
      - citation: "Puckworks input models (2026), docs/model/input-models.md: model assumption, to be calibrated."
      - citation: "Gagné J. (2023) What I learned from analyzing 300 particle size distributions for 24 espresso grinders. Coffee ad Astra."
        url: "https://coffeeadastra.com/2023/09/21/what-i-learned-from-analyzing-300-particle-size-distributions-for-24-espresso-grinders/"
    research_note_ref: "03 Implications A"
    used_by: [G]
    licence_note: "Coffee ad Astra is copyrighted: numbers cited, no scraping (PLAN §11)."
    comment: >-
      Note 03 suggests deriving w_b and σ_b from Gagné's right-half-width "uniformity" or Kaffeemacher's
      60% peak width; neither is available as numbers, so this is a judgement.
    status: draft

  - id: model.psd.coarse_log_width
    name: Log-width of the coarse mode
    symbol: σ_c
    description: >-
      Standard deviation of ln(diameter) of the coarse component of the PSD mixture, for a grinder whose
      family or preset does not set one (families always do; this id lets an override or a calibration
      replace them).
    units: "1"
    value: 0.35
    prior: {distribution: uniform, min: 0.25, max: 0.5}
    range: {min: 0.1, max: 1}
    tag: estimated
    evidence_grade: D
    sources:
      - citation: "Gagné J. (2023) What I learned from analyzing 300 particle size distributions for 24 espresso grinders. Coffee ad Astra."
        url: "https://coffeeadastra.com/2023/09/21/what-i-learned-from-analyzing-300-particle-size-distributions-for-24-espresso-grinders/"
      - citation: "Puckworks input models (2026), docs/model/input-models.md: model assumption, to be calibrated."
    research_note_ref: "03 Implications A"
    used_by: [G]
    licence_note: "Coffee ad Astra is copyrighted: numbers cited, no scraping (PLAN §11)."
    comment: >-
      The flat-traditional family's value; flat-unimodal uses 0.30 and conical 0.40
      (data/presets/grinders/families.yaml). Gagné's mixture widths are shown only as figures (03 §1.5).
    status: draft

  - id: model.psd.boulder_weight
    name: Volume share of the boulder tail
    symbol: w_b
    description: >-
      Volume share of the boulder-tail component of the PSD mixture, for a grinder whose family or preset
      does not set one (families always do; this id lets an override or a calibration replace them).
    units: "1"
    value: 0.05
    prior: {distribution: uniform, min: 0.02, max: 0.1}
    range: {min: 0, max: 0.3}
    tag: estimated
    evidence_grade: D
    sources:
      - citation: "Gagné J. (2023) What I learned from analyzing 300 particle size distributions for 24 espresso grinders. Coffee ad Astra."
        url: "https://coffeeadastra.com/2023/09/21/what-i-learned-from-analyzing-300-particle-size-distributions-for-24-espresso-grinders/"
      - citation: "Puckworks input models (2026), docs/model/input-models.md: model assumption, to be calibrated."
    research_note_ref: "03 Implications A"
    used_by: [G]
    licence_note: "Coffee ad Astra is copyrighted: numbers cited, no scraping (PLAN §11)."
    comment: >-
      The flat-traditional family's value; flat-unimodal uses 0.03 and conical 0.08. Conicals are on
      average less uniform (more boulders), with large overlap between models (03 §2.1).
    status: draft

  - id: model.psd.fines_weight_slope
    name: Slope of the fines weight in the coarse mode
    symbol: γ
    description: >-
      Slope of the grinder model's fines relation, logit w_f = logit w_340 − γ ln(μ_c/μ_340): how fast
      the volume weight w_f of the fines component grows as the coarse mode μ_c shrinks. The relation
      is anchored where the grinder's median is 340 µm and its volume share below 100 µm is u_G.
    units: "1"
    value: 2.0
    prior: {distribution: uniform, min: 1.5, max: 2.5}
    range: {min: 0.5, max: 5}
    relation:
      formula: >-
        Each measured (X50, Q100) pair was converted to the mixture's (μ_c, w_f) with this file's fines
        and boulder components (μ_f 40 µm, σ_f 0.6, σ_c 0.35, w_b 0.05), and logit w_f was regressed on
        ln μ_c for each grinder: Corrochano 2017 disc grinder ΨA–ΨE (dry laser diffraction, X50 61–383
        µm) 2.06 with rms 0.006 in logit, and its roller grinder ΨF–ΨH (X50 602–1297 µm) 2.35; Smrke
        2024 Bentwood V63 (Camsizer, X50 232–352 µm) 2.01 with rms 0.013; Cameron 2020 EK43 (laser
        diffraction, X50 205–360 µm) 1.59 with rms 0.02. With γ = 2 and one u_G per grinder the model
        reproduces Q100 within 0.4 points for Corrochano ΨA–ΨE (u_G 19.9%), Smrke (15.7%) and
        Waszkiewicz 2026's F64 EVO grind (X50 61–64 µm, 18.4%), and within 1.1 points for Cameron
        (16.1%).
    tag: fitted
    evidence_grade: C
    sources:
      - citation: "Roman Corrochano B. (2017) Advancing the engineering understanding of coffee extraction. EngD thesis, University of Birmingham."
        url: "https://etheses.bham.ac.uk/id/eprint/7176/"
        locator: "Table 4.1 (dry laser diffraction); data/datasets/corrochano2017-psd"
      - citation: "Smrke S., Eiermann A., Yeretzian C. (2024) The role of fines in espresso extraction dynamics. Sci. Rep. 14:5612."
        doi: "10.1038/s41598-024-55831-x"
        locator: "Fig. 2; data/datasets/smrke2024-psd"
      - citation: "Cameron M.I., Morisco D., Hofstetter D., Uman E., Wilkinson J., Kennedy Z.C., Fontenot S.A., Lee W.T., Hendon C.H., Foster J.M. (2020) Systematically improving espresso: insights from mathematical modeling and experiment. Matter 2:631–648."
        doi: "10.1016/j.matt.2019.12.019"
        locator: "Fig. 2B; data/datasets/cameron2020-psd"
      - citation: "Waszkiewicz R., Myck F., Białas Ł., Puciata-Mroczynska M., Dzikowski M., Szymczak P., Lisicki M. (2026) Under pressure: poroelastic regulation of flow in espresso brewing. Phys. Fluids 38:063113."
        doi: "10.1063/5.0319611"
        locator: "Fig. 2 (Zenodo 10.5281/zenodo.18046315); data/datasets/waszkiewicz2026-psd; check only"
    research_note_ref: ["03 §1.2", "03 §2.2"]
    used_by: [G]
    comment: >-
      Replaces v1's linear relation Q100 = u_G − β (X50 − 340 µm) (psd.fines_slope), which was measured
      for X50 ≈ 190–383 µm only and needed clamps at 4% and 40%, so it could not represent espresso-fine
      grinds (X50 ≈ 60 µm with 65% below 100 µm). Basis: dry laser diffraction and dynamic image
      analysis (Camsizer x_area), which agree at the level of X50 and Q100 for these grinders; wet laser
      diffraction (Schmieder 2023, Corrochano's wet table) adds a 1–10 µm debris population and is not
      used. Shot, flow and permeability data were not used. A fit by the project, hence grade C.
    status: draft

  - id: model.psd.roast_coefficient
    name: Relative change of grind size per unit roast level
    symbol: a_r
    description: >-
      Relative decrease of the volume median X50 per unit of roast level (0 = very light, 1 = very
      dark), relative to a medium roast (roast level 0.5), at a fixed burr gap:
      f_roast = 1 − a_r (roast_level − 0.5).
    units: "1"
    value: 0.15
    prior: {distribution: uniform, min: 0.05, max: 0.35}
    range: {min: 0, max: 1}
    tag: estimated
    evidence_grade: D
    sources:
      - citation: "Méndez Harper J. et al. (2024; online 2023) Moisture-controlled triboelectrification during coffee grinding. Matter 7:1–18."
        doi: "10.1016/j.matt.2023.11.005"
      - citation: "Puckworks input models (2026), docs/model/input-models.md: model assumption, to be calibrated."
    research_note_ref: ["03 §2.1", "03 §2.2"]
    used_by: [G, B]
    licence_note: "Méndez Harper 2024 raw data (Figshare) are CC BY 4.0: attribution required."
    comment: >-
      On an EK43 the darkest roast had a ≈100 µm finer mean than the lightest at the same setting
      (settings 1–6), and light at 2.0 matched dark at 2.3 (psd.grinder.ek43.dark_roast_mean_reduction;
      03 §2.2). With the estimated EK43 dial mapping of the mahlkoenig-ek43 preset (70 µm of gap per
      unit) and light/dark taken as roast levels 0.25/0.85, the setting match implies a_r ≈ 0.14. The
      roast levels of that series and the EK43 mapping are assumptions, hence grade D. The
      medium-roast reference is a convention: the grinders' source coffees are medium or unstated.
    status: draft

  - id: model.psd.cold_size_reduction
    name: Grind-size reduction of frozen beans
    symbol: a_T
    description: >-
      Relative decrease of the volume median X50 for beans ground at −19 °C or colder versus 20 °C, at a
      fixed burr gap; linear in temperature between −19 and 20 °C and zero above 20 °C:
      f_T = 1 − a_T clamp((20 − T)/39, 0, 1).
    units: "1"
    value: 0.10
    prior: {distribution: uniform, min: 0, max: 0.31}
    range: {min: 0, max: 1}
    tag: estimated
    evidence_grade: D
    sources:
      - citation: "Uman E., Colonna-Dashwood M., Colonna-Dashwood L., Perger M., Klatt C., Leighton S., Miller B., Butler K.T., Melot B.C., Speirs R.W., Hendon C.H. (2016) The effect of bean origin and temperature on grinding roasted coffee. Sci. Rep. 6:24483."
        doi: "10.1038/srep24483"
      - citation: "Puckworks input models (2026), docs/model/input-models.md: model assumption, to be calibrated."
    research_note_ref: "03 §2.1"
    used_by: [G]
    comment: >-
      Uman 2016 (A): the number mode fell by 31% from 20 °C to −196 °C and the PSD narrowed, mostly
      between 20 and −19 °C. The effect on the volume median is not reported; 10% at −19 °C is a
      judgement, and the narrowing is not modelled. Warm beans (above 20 °C) get no correction because
      no PSD data exist (03 §2.1).
    status: draft

  # -- Bed and hydraulics (modules P, H) -------------------------------------------------
  - id: model.hydraulics.reference_sauter_diameter
    name: Sauter diameter at which the reference permeability is defined
    symbol: D32_ref
    description: >-
      Sauter diameter of the size classes at which the bare base permeability
      hydraulics.permeability.reference is defined; the input models scale κ₀ to a recipe's classes by
      relative Kozeny–Carman, κ₀ = κ_ref (D32/D32_ref)² KC(ε)/KC(ε_ref).
    units: um
    value: 165
    range: {min: 20, max: 2000}
    tag: estimated
    evidence_grade: D
    sources:
      - citation: "Puckworks input models (2026), docs/model/input-models.md: a convention of the permeability scaling."
    research_note_ref: ["01 §4.2", "01 §4.3"]
    used_by: [P, H]
    comment: >-
      A convention, not a measurement: in κ₀ = κ_ref (D32/D32_ref)² …, D32_ref and κ_ref are not
      separately identifiable, so calibration fits κ_ref at this fixed D32_ref. 165 µm is kept from v1 so
      that calibrations stay comparable; a typical espresso grind of the model has D32 ≈ 100 µm. In-shot
      permeability is calibrated, never predicted from the PSD; Kozeny–Carman gives only relative changes
      (01 §4.3, Implications 2). v1 anchored κ₀ on the apparent in-shot permeability
      (hydraulics.permeability.in_shot, q μ L/ΔP at 9 bar), which already includes compaction and
      swelling that the solver applies again; the bare reference replaces it.
    status: draft
  - id: model.hydraulics.swelling_pore_closure
    name: Share of particle swelling that closes intergranular pores
    symbol: f_sw
    description: >-
      Fraction of the particle volume growth on wetting that fills intergranular pore space; the rest
      fills the particle's own pores or lifts the bed. Maps the registry's diameter swelling to the
      permeability factor of the swelling relaxation through Kozeny–Carman.
    units: "1"
    value: 0.1
    prior: {distribution: uniform, min: 0, max: 0.3}
    range: {min: 0, max: 1}
    tag: estimated
    evidence_grade: D
    sources:
      - citation: "Puckworks input models (2026), docs/model/input-models.md: model assumption, to be calibrated."
      - citation: "Hargarten V.B., Kuhn M., Briesen H. (2020) Swelling properties of roasted coffee particles. J. Sci. Food Agric. 100:3960–3970."
        doi: "10.1002/jsfa.10440"
    research_note_ref: "01 §4.6"
    used_by: [H]
    comment: >-
      Note 01 recommends treating swelling as a calibration parameter acting mainly on intergranular
      porosity; its magnitude is disputed (0–15% in diameter). With ε = 0.17, S = 7.5% and f_sw = 0.1 the
      swelling amplitude is 0.347. Swelling under confinement is unmeasured (01 Open questions 5).
    status: draft

  - id: model.hydraulics.gas_amplitude_max
    name: Largest CO₂ permeability penalty
    symbol: A_gas,max
    description: Upper limit of the amplitude of the gas permeability factor 1 − A e^(−t/τ) for very gassy coffee.
    units: "1"
    value: 0.5
    prior: {distribution: uniform, min: 0.1, max: 0.8}
    range: {min: 0, max: 0.95}
    tag: estimated
    evidence_grade: D
    sources:
      - citation: "Puckworks input models (2026), docs/model/input-models.md: model assumption, to be calibrated."
      - citation: "Roman Corrochano B. (2017) Advancing the engineering understanding of coffee extraction. EngD thesis, University of Birmingham."
        url: "https://etheses.bham.ac.uk/id/eprint/7176/"
        locator: "Table 6.2"
    research_note_ref: "01 §4.9"
    used_by: [H, B]
    comment: >-
      No direct measurement of the hydraulic effect of CO₂ in espresso exists (01 §4.9). On paper the
      gas could occupy 0.5–3× the pore volume (hydraulics.gas.potential_volume_ratio), but under pressure
      it partly dissolves. The mapping A = A_max c/(c + c_half) is a documented estimate.
    status: draft

  - id: model.hydraulics.gas_half_content
    name: CO₂ content giving half the largest gas penalty
    symbol: c_half
    description: CO₂ held by the ground coffee in the puck (mg per g of coffee) at which the gas amplitude reaches half its maximum.
    units: "mg/g"
    value: 8.25
    prior: {distribution: uniform, min: 4.5, max: 12}
    range: {min: 0.01, max: 100}
    relation:
      derived_from: [bean.co2.ground_residual]
      formula: "c_half = the central measured CO₂ of freshly ground coffee (bean.co2.ground_residual, 4.5–12 mg/g): half the largest penalty for fresh grounds"
    tag: estimated
    evidence_grade: D
    sources:
      - citation: "Puckworks input models (2026), docs/model/input-models.md: model assumption, to be calibrated."
      - citation: "Smrke S., Wellinger M., Suzuki T., Balsiger F., Opitz S.E.W., Yeretzian C. (2018) Time-resolved gravimetric method to assess degassing of roasted coffee. J. Agric. Food Chem. 66:5293–5300."
        doi: "10.1021/acs.jafc.7b03310"
    research_note_ref: "01 §4.9"
    used_by: [H, B]
    comment: >-
      The puck CO₂ is on the scale of the measured residual of freshly ground coffee (4.5–12 mg/g;
      note 02 gives 1–2% of fresh bean weight entrapped): medium roast ≈ 7 mg/g fresh, ≈ 2.9 mg/g after
      ten days. Setting c_half at fresh-ground levels gives fresh coffee about half the largest penalty
      and week-old coffee a clear but smaller one. Tying the scale to the residual is a judgement.
    status: draft
  - id: model.hydraulics.gas_relaxation_time
    name: Time constant of the CO₂ permeability penalty
    symbol: τ_gas
    description: Time constant of the decaying gas permeability factor 1 − A e^(−t/τ) after wetting.
    units: s
    value: 5
    prior: {distribution: uniform, min: 2, max: 15}
    range: {min: 0.1, max: 600}
    tag: estimated
    evidence_grade: D
    sources:
      - citation: "Puckworks input models (2026), docs/model/input-models.md: model assumption, to be calibrated."
    research_note_ref: "01 §4.11"
    used_by: [H]
    comment: >-
      CO₂ and air displacement raise flow over "early seconds, larger for fresh coffee" (01 §4.11,
      inferred from Corrochano 2017). No timescale has been measured.
    status: draft

  - id: model.hydraulics.fines_layer_amplitude
    name: Amplitude of the outlet fines resistance
    symbol: A_fines
    description: Amplitude of the growing outlet resistance from fines migration, relative to the initial bed resistance.
    units: "1"
    value: 0
    prior: {distribution: uniform, min: 0, max: 1}
    range: {min: 0, max: 10}
    tag: estimated
    evidence_grade: D
    sources:
      - citation: "Puckworks input models (2026), docs/model/input-models.md: model assumption, to be calibrated."
      - citation: "Ellero M., Navarini L. (2019) Mesoscopic modelling and simulation of espresso coffee extraction. J. Food Eng. 263:181–194."
        doi: "10.1016/j.jfoodeng.2019.05.038"
    research_note_ref: "01 §4.7"
    used_by: [H]
    comment: >-
      Switched off (0) until calibrated: fines migration is inferred from flow, not observed in situ
      (03 Open questions 7). In a simulation a fines solid fraction of 0.006 cut permeability by nearly
      an order of magnitude (Ellero & Navarini 2019), so the plausible range is wide.
    status: draft

  - id: model.hydraulics.fines_layer_time
    name: Time constant of the outlet fines resistance
    symbol: τ_fines
    description: Time constant of the growth of the outlet fines resistance A R_bed(0)(1 − e^(−t/τ)).
    units: s
    value: 10
    prior: {distribution: uniform, min: 3, max: 30}
    range: {min: 0.1, max: 600}
    tag: estimated
    evidence_grade: D
    sources:
      - citation: "Puckworks input models (2026), docs/model/input-models.md: model assumption, to be calibrated."
    research_note_ref: ["01 §4.7", "01 §4.11"]
    used_by: [H]
    comment: Fines migration to the outlet acts over "seconds to tens of seconds" (01 §4.11).
    status: draft

  - id: model.hydraulics.viscosity_ln_a1
    name: Linear coefficient of the coffee-extract viscosity fit
    symbol: a1
    description: Coefficient a1 in ln(μ/μ_water) = a1 w + a2 w² for coffee solutions of solute mass fraction w, at 4 °C.
    units: "1"
    value: 3.75
    range: {min: 0, max: 10}
    relation:
      formula: >-
        Solved exactly through Moreno's 20% and 35% w/w points at 4 °C: ln(5.84/1.567) = 0.2 a1 + 0.04 a2
        and ln(32.9/1.567) = 0.35 a1 + 0.1225 a2, with water at 1.567 mPa s (CRC), giving a1 = 3.75,
        a2 = 14.1
    conditions: Coffee solutions of 5–35% w/w at 4 °C.
    tag: derived
    evidence_grade: A
    sources:
      - citation: "Moreno F.L. et al. (2015) Rheological behaviour, freezing curve, and density of coffee solutions near freezing. Int. J. Food Prop. 18:426–438."
        doi: "10.1080/10942912.2013.833221"
      - citation: "CRC Handbook of Chemistry and Physics: standard values for the viscosity of water, as quoted in research note 01 §4.10."
    research_note_ref: "01 §4.10"
    used_by: [H]
    comment: >-
      Reproduces the 5% point to −1.6% in relative viscosity; at 50% w/w (outside the espresso range) it
      reads 18% low. The fit describes low-temperature data only; the transfer to brew temperature is
      the separate, much less certain exponent model.hydraulics.viscosity_temperature_exponent.
    status: draft

  - id: model.hydraulics.viscosity_ln_a2
    name: Quadratic coefficient of the coffee-extract viscosity fit
    symbol: a2
    description: Coefficient a2 in ln(μ/μ_water) = a1 w + a2 w² for coffee solutions of solute mass fraction w, at 4 °C.
    units: "1"
    value: 14.1
    range: {min: 0, max: 40}
    relation:
      formula: "Solved with model.hydraulics.viscosity_ln_a1 through Moreno's 20% and 35% w/w points at 4 °C"
    conditions: Coffee solutions of 5–35% w/w at 4 °C.
    tag: derived
    evidence_grade: A
    sources:
      - citation: "Moreno F.L. et al. (2015) Rheological behaviour, freezing curve, and density of coffee solutions near freezing. Int. J. Food Prop. 18:426–438."
        doi: "10.1080/10942912.2013.833221"
    research_note_ref: "01 §4.10"
    used_by: [H]
    comment: See model.hydraulics.viscosity_ln_a1.
    status: draft

  - id: model.hydraulics.viscosity_temperature_exponent
    name: Temperature exponent of the relative extract viscosity
    symbol: γ
    description: >-
      Exponent γ ≤ 1 that shrinks the low-temperature relative viscosity at brew temperature:
      μ/μ_water(T) = exp(a1 w + a2 w²)^γ.
    units: "1"
    value: 0.45
    prior: {distribution: uniform, min: 0.22, max: 0.60}
    range: {min: 0, max: 1}
    relation:
      derived_from:
        - hydraulics.viscosity.extract_relative
        - model.hydraulics.viscosity_ln_a1
        - model.hydraulics.viscosity_ln_a2
      formula: >-
        γ = ln(R)/(a1·0.25 + a2·0.25²) so that 25% w/w extract has relative viscosity R at brew
        temperature: R = 2.25 (central of 1.5–3) gives γ = 0.811/1.82 = 0.45; R = 1.5 and 3 bound the
        prior at 0.22 and 0.60
    tag: derived
    evidence_grade: B
    sources:
      - citation: "Moreno F.L. et al. (2015) Rheological behaviour, freezing curve, and density of coffee solutions near freezing. Int. J. Food Prop. 18:426–438."
        doi: "10.1080/10942912.2013.833221"
    research_note_ref: ["01 §4.10", "01 §4.11"]
    used_by: [H]
    comment: >-
      Relative viscosity at 90 °C and 5–25% TDS is a data gap (01 §4.10): the 1.5–3× it inherits is an
      inference "[magnitude unverified at 90 °C]". Extrapolating Moreno's Arrhenius energies from 4 °C
      gives unphysical values below 1 at low concentration, so this exponent replaces that route.
    status: draft

  - id: model.hydraulics.wetting_uptake
    name: Legacy pore partition and extraction loading scale
    description: >-

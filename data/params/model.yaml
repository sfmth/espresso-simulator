  - id: model.prep.edge_multiplier.base
    name: Edge permeability multiplier without paper or screen
    description: Permeability multiplier of the outer annulus for a precision basket with no bottom paper and no puck screen.
    units: "1"
    value: 0.35
    prior: {distribution: uniform, min: 0.2, max: 0.6}
    range: {min: 0.01, max: 1}
    relation:
      derived_from: [bed.heterogeneity.edge_centre_ey_ratio.stock]
      formula: >-
        With an exponential extraction curve EY = 30%·(1 − e^(−V/λ)) fitted to the centre (25% at 1:2.5),
        an edge EY of 13% needs about a third of the centre's flow per gram: 0.79/2.5 = 0.32
    tag: estimated
    evidence_grade: D
    sources:
      - citation: "Ribes S. (2020) Radial uniformity of espresso extractions (paper below puck; tamper base). Decent public Basecamp."
        url: "https://public.3.basecamp.com/p/9vnWSmKqDokidAMuEcUvKYf8"
    research_note_ref: ["03 Implications B", "01 §6"]
    used_by: [P]
    comment: >-
      Community coring, one operator (D): centre 25%, edge 13% EY without a bottom paper (VST 15 g basket,
      EK43). The conversion from an EY ratio to a permeability ratio assumes a simple extraction curve,
      so this is an estimate to be calibrated against the edge/centre EY ratios themselves.
    status: draft


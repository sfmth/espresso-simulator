  - id: model.extraction.solute_apparent_density
    name: Apparent density of the dissolved solids
    symbol: 1/v̄
    description: >-
      Inverse of the apparent specific volume v̄ of the dissolved coffee solids: a liquid holding c kg/m³
      of solids has density ρ_w(1 − c/ρ_app) + c. Converts the outflow volume to beverage mass and the
      concentration to TDS (w/w).
    units: "kg/m^3"
    value: 1570
    prior: {distribution: uniform, min: 1300, max: 2000}
    range: {min: 800, max: 2500}
    relation:
      derived_from: [hydraulics.extract_density.low_temperature]
      formula: >-
        25% w/w extract ≈ 275 kg/m³ at a density of 1.10 g/mL (01 §4.10): v̄ = (ρ_w + c − ρ)/(ρ_w c) =
        (1000 + 275 − 1100)/(1000 × 275) = 6.36×10⁻⁴ m³/kg, so ρ_app = 1/v̄ ≈ 1570 kg/m³
    tag: derived
    evidence_grade: A
    sources:
      - citation: "Moreno F.L. et al. (2015) Rheological behaviour, freezing curve, and density of coffee solutions near freezing. Int. J. Food Prop. 18:426–438."
        doi: "10.1080/10942912.2013.833221"
    research_note_ref: "01 §4.10"
    used_by: [X, C]
    comment: >-
      The solver's spec field is the specific volume (solubles.solute_specific_volume_m3_kg = 1/ρ_app;
      its default 6.4×10⁻⁴ m³/kg is the same estimate). Stored as a density because the unit vocabulary has
      no m³/kg. The density data are for 0–25 °C; thermal expansion at brew temperature is not included.
    status: draft


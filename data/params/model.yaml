    units: "%"
    value: 50
    prior: {distribution: uniform, min: 25, max: 75}
    range: {min: 0, max: 95}
    tag: estimated
    evidence_grade: D
    sources:
      - citation: "Smrke S., Wellinger M., Suzuki T., Balsiger F., Opitz S.E.W., Yeretzian C. (2018) Time-resolved gravimetric method to assess degassing of roasted coffee. J. Agric. Food Chem. 66:5293–5300."
        doi: "10.1021/acs.jafc.7b03310"
      - citation: "Puckworks input models (2026), docs/model/input-models.md: model assumption, to be calibrated."
    research_note_ref: "02 §4.4"
    used_by: [B]
    comment: >-
      Grinding fresh coffee releases "up to 75%" of the gas within 90 s, and some CO₂ stays sorbed until
      wetting (02 §4.4). The puck CO₂ is anchored to the measured residual of freshly ground coffee
      (bean.co2.ground_residual), so this share only converts it to the whole-bean value
      (derived.bean.co2_beans_mg_g = puck/(1 − loss)): fresh medium beans then hold ≈ 14 mg/g, inside the
      1–2% by weight of note 02.

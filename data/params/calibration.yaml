        doi: "10.3390/foods12152871"
        locator: "Table S1"
    research_note_ref: "02 §1.1"
    used_by: [X]
    comment: >-
      Bean-specific nuisance parameter of the M1 calibration (V1), not used by the app. Prior: the
      roasted-Arabica range of bean.composition.arabica.trigonelline (0.2–1.2%); about 105 mg reached a
      60 g cup from 20 g (0.52%).
    status: draft


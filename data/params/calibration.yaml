  - id: calibration.schmieder2023.sigma_ln_permeability
    name: Conditional inner permeability spread, Schmieder 2023
    symbol: σ_lnκ
    description: >-
      Standard deviation of ln(permeability multiplier) in the inner columns of the Schmieder et al.
      (2023) bed, before the fixed prewetting spread is added in quadrature. A dataset-specific
      nuisance parameter for Grande TRE distribution and 25 kgf tamping, not a tapping calibration.
    units: "1"
    prior: {distribution: uniform, min: 0.1958834072815894, max: 0.7400293465932837}
    range: {min: 0, max: 3}
    relation:
      derived_from: [model.prep.sigma_ln_permeability.tap, model.prep.sigma_fines_sensitivity]
      formula: >-
        Prior support only: intersect sigma_dist * max(1 + 2*(Q100 - 0.2), 0.5) for
        sigma_dist in [0.15, 0.6] over the three nominal 16-class wet-CDF inputs. The factors are
        1.3058893818772628 (GL 1.4), 1.268907031738601 (GL 1.7), and 1.2333822443221394 (GL 2.0).
        The fitted actual sigma is shared by all three groups; the Q100 correction is not reapplied.
    conditions: 20 g in an IMS 58 mm basket; Grande TRE distributor and CPS Tamper at 25 kgf.
    tag: fitted
    evidence_grade: D
    sources:
      - citation: "Schmieder B.K.L., Pannusch V.B., Vannieuwenhuyse L., Briesen H., Minceva M. (2023) Influence of flow rate, particle size, and temperature on espresso extraction kinetics. Foods 12:2871."
        doi: "10.3390/foods12152871"
        locator: "Section 2.4 (reported preparation and PSD); Table S1 (kinetic observations)"
      - citation: "Puckworks input models (2026), docs/model/input-models.md: grade-D preparation and fines-spread assumptions, not measured bed heterogeneity."
    research_note_ref: ["03 §4", "03 Implications B"]
    used_by: [H, X]
    comment: >-
      Written directly to bed.heterogeneity.sigma_ln_permeability in V1; it does not change the app's
      tap, WDT or fines-sensitivity defaults. Grande TRE is not a supported distribution category,
      so the old omitted category fell back to tap without source evidence for that mapping. The
      prior is a conservative intersection of existing grade-D supports, not an independent
      preparation measurement. Prewet nonuniformity and edge area stay fixed; only their combined
      effect with this spread is observable. The fit's uncertainty is conditional on those choices.
    status: draft

  - id: calibration.schmieder2023.edge_multiplier
    name: Conditional edge permeability multiplier, Schmieder 2023
    description: >-
      Actual permeability multiplier of the outer annulus in the Schmieder et al. (2023) bed,
      after basket geometry. A dataset-specific nuisance parameter for the reported preparation
      and basket, separate from the app's generic preparation coefficients.
    units: "1"
    prior: {distribution: uniform, min: 0.22904616411299045, max: 0.6871384923389713}
    range: {min: 0.01, max: 1}
    relation:
      derived_from: [model.prep.edge_multiplier.base, model.basket.edge_reference_ratio, model.basket.edge_ratio_exponent]
      formula: >-
        Prior support only: [0.2, 0.6] * ((27/29)/0.87)^2 =
        [0.22904616411299045, 0.6871384923389713]. The factor 1.1452308205649522 is the nominal
        case builder's existing basket correction; the fitted multiplier already includes it.
    conditions: 20 g in an IMS 58 mm basket; Grande TRE distributor and CPS Tamper at 25 kgf.
    tag: fitted
    evidence_grade: D
    sources:
      - citation: "Schmieder B.K.L., Pannusch V.B., Vannieuwenhuyse L., Briesen H., Minceva M. (2023) Influence of flow rate, particle size, and temperature on espresso extraction kinetics. Foods 12:2871."
        doi: "10.3390/foods12152871"
        locator: "Sections 2.4–2.5 (preparation and basket); Table S1 (kinetic observations)"
      - citation: "Puckworks input models (2026), docs/model/input-models.md: grade-D edge and basket assumptions, not measured radial flow."
    research_note_ref: ["03 §4", "03 Implications B", "01 §6"]
    used_by: [H, X]
    comment: >-
      Written directly to bed.heterogeneity.edge_multiplier in V1, with the existing edge area
      fraction held fixed. The prior transforms the existing generic edge prior through the case's
      nominal basket correction; neither source measures this bed's radial permeability. Do not
      reapply that correction or export this conditional fit as the generic edge preparation value.
    status: draft

  - id: calibration.waszkiewicz2026.permeability
    name: Bare base permeability, Waszkiewicz 2026
    symbol: κ₀
    description: >-
      Bare base permeability κ₀ (shot-model.md §4.2) of the wetted bed for the Waszkiewicz et al. (2026) coffee (Fiorenzato F64 EVO,
      setting 1.9), fitted to the long-time flow at 11 constant basket pressures.
    units: "m^2"
    prior: {distribution: lognormal, lower: 2.0e-15, upper: 2.0e-13, coverage: 0.95}
    range: {min: 0}
    conditions: 18.5 g in an IMS 58 mm basket, dry bed 14 mm, 1–12.4 bar basket pressure, 100 s.
    tag: fitted
    evidence_grade: B
    sources:
      - citation: "Waszkiewicz R., Myck F., Białas Ł., Puciata-Mroczynska M., Dzikowski M., Szymczak P., Lisicki M. (2026) Under pressure: poroelastic regulation of flow in espresso brewing. Phys. Fluids 38:063113."
        doi: "10.1063/5.0319611"
        locator: "Fig. 6; Zenodo doi:10.5281/zenodo.18046315"
    research_note_ref: ["01 §4.3", "01 §3.7"]
    used_by: [H]
    comment: >-
      Nuisance parameter of the M1 calibration (validation step V4), fitted together with the shared
      poroelastic pressure scale hydraulics.poroelastic.critical_pressure; pooled into
      hydraulics.permeability.reference after dividing by the input models' Sauter-diameter scaling for
      this case. A bare permeability; note 01 §4.3 derives apparent values of 1.8–3.5×10⁻¹⁵ m² from the
      9-bar flows. Prior as for the Schmieder records.
    status: draft

  - id: calibration.schmieder2023.extractable_fraction
    name: Extractable solubles of the Schmieder 2023 coffee
    symbol: EY_max
    description: >-
      Extractable solubles per dry dose (maximum extraction yield) of the washed Colombian Arabica of
      Schmieder et al. (2023), fitted with the M1 kinetics to the TDS of the analysed fractions.
    units: "%"
    prior: {distribution: uniform, min: 22, max: 34}
    range: {min: 0, max: 100}
    conditions: Colombia Suprema Huila, roasted 180→212 °C in about 10 min, rested two weeks.
    tag: fitted
    evidence_grade: B
    sources:
      - citation: "Schmieder B.K.L., Pannusch V.B., Vannieuwenhuyse L., Briesen H., Minceva M. (2023) Influence of flow rate, particle size, and temperature on espresso extraction kinetics. Foods 12:2871."
        doi: "10.3390/foods12152871"
        locator: "Table S1"
    research_note_ref: ["01 §5.5", "02 §3.1"]
    used_by: [X]
    comment: >-
      Bean-specific nuisance parameter of the M1 calibration (V1), not used by the app (whose extractable
      fraction comes from extraction.max_yield and the bean model). Prior: the range of
      extraction.max_yield.
    status: draft


# SPDX-License-Identifier: GPL-2.0-or-later
schema: puckworks.parameters/1
description: >-
  Setup-specific (nuisance) parameters of the M1 calibration (docs/PLAN.md §12 M1; data/calibration):
  quantities that belong to one dataset's coffee, grinder and machine, fitted together with the shared
  model parameters so that those are not biased. The app does not read them; data/calibration/current.yaml
  records their fitted values under `fit.nuisance`, and the bare permeabilities are pooled into
  hydraulics.permeability.reference.

parameters:
  - id: calibration.schmieder2023.permeability.gl1_4
    name: Bare base permeability, Schmieder 2023, grinding level 1.4
    symbol: κ₀
    description: >-
      Bare base permeability κ₀ (shot-model.md §4.2) of the wetted bed for the Schmieder et al. (2023) coffee ground on a Mahlkönig
      E65S at grinding level 1.4, fitted to the shots' peak pressures under flow control.
    units: "m^2"
    prior: {distribution: lognormal, lower: 2.0e-15, upper: 2.0e-13, coverage: 0.95}
    range: {min: 0}
    conditions: 20 g in an IMS 58 mm basket, DE1 flow control at 1–3 mL/s, 80–98 °C.
    tag: fitted
    evidence_grade: B
    sources:
      - citation: "Schmieder B.K.L., Pannusch V.B., Vannieuwenhuyse L., Briesen H., Minceva M. (2023) Influence of flow rate, particle size, and temperature on espresso extraction kinetics. Foods 12:2871."
        doi: "10.3390/foods12152871"
        locator: "Tables 2 and S3 (pressures)"
    research_note_ref: "01 §4.3"
    used_by: [H]
    comment: >-
      Nuisance parameter of the M1 calibration (validation step V1), not used by the app directly: divided
      by the input models' Sauter-diameter scaling for this case, it is one of the values pooled into
      hydraulics.permeability.reference. A bare permeability (the solver multiplies it by compaction,
      swelling, gas, dissolution and viscosity factors), so it lies above the apparent in-shot values
      (hydraulics.permeability.in_shot, 1.8×10⁻¹⁵–1.5×10⁻¹⁴ m²; note 01 §4.3 derives 6.8×10⁻¹⁵ m² for GL 1.4
      at 8.0 bar). The prior spans that range and a decade above it.
    status: draft

  - id: calibration.schmieder2023.permeability.gl1_7
    name: Bare base permeability, Schmieder 2023, grinding level 1.7
    symbol: κ₀
    description: >-
      Bare base permeability κ₀ (shot-model.md §4.2) of the wetted bed for the Schmieder et al. (2023) coffee ground on a Mahlkönig
      E65S at grinding level 1.7, fitted to the shots' peak pressures under flow control.
    units: "m^2"
    prior: {distribution: lognormal, lower: 2.0e-15, upper: 2.0e-13, coverage: 0.95}
    range: {min: 0}
    conditions: 20 g in an IMS 58 mm basket, DE1 flow control at 1–3 mL/s, 80–98 °C.
    tag: fitted
    evidence_grade: B
    sources:
      - citation: "Schmieder B.K.L., Pannusch V.B., Vannieuwenhuyse L., Briesen H., Minceva M. (2023) Influence of flow rate, particle size, and temperature on espresso extraction kinetics. Foods 12:2871."
        doi: "10.3390/foods12152871"
        locator: "Tables 2 and S3 (pressures)"
    research_note_ref: "01 §4.3"
    used_by: [H]
    comment: >-
      Nuisance parameter of the M1 calibration (V1); pooled into hydraulics.permeability.reference as for
      GL 1.4. Prior as for GL 1.4.
    status: draft

  - id: calibration.schmieder2023.permeability.gl2_0
    name: Bare base permeability, Schmieder 2023, grinding level 2.0
    symbol: κ₀
    description: >-
      Bare base permeability κ₀ (shot-model.md §4.2) of the wetted bed for the Schmieder et al. (2023) coffee ground on a Mahlkönig
      E65S at grinding level 2.0, fitted to the shots' peak pressures under flow control.
    units: "m^2"
    prior: {distribution: lognormal, lower: 2.0e-15, upper: 2.0e-13, coverage: 0.95}
    range: {min: 0}
    conditions: 20 g in an IMS 58 mm basket, DE1 flow control at 1–3 mL/s, 80–98 °C.
    tag: fitted
    evidence_grade: B
    sources:
      - citation: "Schmieder B.K.L., Pannusch V.B., Vannieuwenhuyse L., Briesen H., Minceva M. (2023) Influence of flow rate, particle size, and temperature on espresso extraction kinetics. Foods 12:2871."
        doi: "10.3390/foods12152871"
        locator: "Tables 2 and S3 (pressures)"
    research_note_ref: "01 §4.3"
    used_by: [H]
    comment: >-
      Nuisance parameter of the M1 calibration (V1); pooled into hydraulics.permeability.reference as for
      GL 1.4. Prior as for GL 1.4; note 01 §4.3 derives an apparent 1.5×10⁻¹⁴ m² for GL 2.0 at 3.6 bar.
    status: draft

  - id: calibration.waszkiewicz2026.permeability
    name: Bare base permeability, Waszkiewicz 2026
    symbol: κ₀
    description: >-
      Bare base permeability κ₀ (shot-model.md §4.2) of the wetted bed for the Waszkiewicz et al. (2026) coffee (Fiorenzato F64 EVO,
      setting 1.9), fitted to the long-time flow at 11 constant basket pressures.
    units: "m^2"
    prior: {distribution: lognormal, lower: 2.0e-15, upper: 2.0e-13, coverage: 0.95}
    range: {min: 0}
    conditions: 18.5 g in an IMS 58 mm basket, dry bed 14 mm, 1–12.4 bar basket pressure, 100 s.
    tag: fitted
    evidence_grade: B
    sources:
      - citation: "Waszkiewicz R., Myck F., Białas Ł., Puciata-Mroczynska M., Dzikowski M., Szymczak P., Lisicki M. (2026) Under pressure: poroelastic regulation of flow in espresso brewing. Phys. Fluids 38:063113."
        doi: "10.1063/5.0319611"
        locator: "Fig. 6; Zenodo doi:10.5281/zenodo.18046315"
    research_note_ref: ["01 §4.3", "01 §3.7"]
    used_by: [H]
    comment: >-
      Nuisance parameter of the M1 calibration (validation step V4), fitted together with the shared
      poroelastic pressure scale hydraulics.poroelastic.critical_pressure; pooled into
      hydraulics.permeability.reference after dividing by the input models' Sauter-diameter scaling for
      this case. A bare permeability; note 01 §4.3 derives apparent values of 1.8–3.5×10⁻¹⁵ m² from the
      9-bar flows. Prior as for the Schmieder records.
    status: draft

  - id: calibration.schmieder2023.extractable_fraction
    name: Extractable solubles of the Schmieder 2023 coffee
    symbol: EY_max
    description: >-
      Extractable solubles per dry dose (maximum extraction yield) of the washed Colombian Arabica of
      Schmieder et al. (2023), fitted with the M1 kinetics to the TDS of the analysed fractions.
    units: "%"
    prior: {distribution: uniform, min: 22, max: 34}
    range: {min: 0, max: 100}
    conditions: Colombia Suprema Huila, roasted 180→212 °C in about 10 min, rested two weeks.
    tag: fitted
    evidence_grade: B
    sources:
      - citation: "Schmieder B.K.L., Pannusch V.B., Vannieuwenhuyse L., Briesen H., Minceva M. (2023) Influence of flow rate, particle size, and temperature on espresso extraction kinetics. Foods 12:2871."
        doi: "10.3390/foods12152871"
        locator: "Table S1"
    research_note_ref: ["01 §5.5", "02 §3.1"]
    used_by: [X]
    comment: >-
      Bean-specific nuisance parameter of the M1 calibration (V1), not used by the app (whose extractable
      fraction comes from extraction.max_yield and the bean model). Prior: the range of
      extraction.max_yield.
    status: draft

  - id: calibration.schmieder2023.content.caffeine
    name: Extractable caffeine of the Schmieder 2023 coffee
    description: >-
      Extractable caffeine per dry dose of the Schmieder et al. (2023) coffee, fitted with the M1 kinetics
      to the caffeine concentrations of the analysed fractions.
    units: "%"
    prior: {distribution: uniform, min: 0.8, max: 1.6}
    range: {min: 0, max: 100}
    conditions: Washed Colombian Arabica, medium roast.
    tag: fitted
    evidence_grade: B
    sources:
      - citation: "Schmieder B.K.L., Pannusch V.B., Vannieuwenhuyse L., Briesen H., Minceva M. (2023) Influence of flow rate, particle size, and temperature on espresso extraction kinetics. Foods 12:2871."
        doi: "10.3390/foods12152871"
        locator: "Table S1"
    research_note_ref: "02 §1.1"
    used_by: [X]
    comment: >-
      Bean-specific nuisance parameter of the M1 calibration (V1), not used by the app. The prior widens the
      Arabica caffeine content (bean.composition.arabica.caffeine, 1.1–1.3%) to allow for incomplete
      extraction within the shot and for this coffee: about 207 mg reached a 60 g cup from 20 g (1.04%).
    status: draft


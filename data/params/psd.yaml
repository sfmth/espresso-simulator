  # -- Named grinders ----------------------------------------------------------------
  - id: psd.grinder.e65s.indicator_step
    name: Mahlkönig E65S burr movement per dial indicator
    symbol: Δ
    description: Change in nominal burr spacing per indicator of the E65S adjustment dial, in g = g₀ + Δ(s − s₀).
    units: um
    value: 5
    range: {min: 0}
    relation:
      formula: "(580 − 180) µm / 80 indicators ≈ 5 µm per indicator, if the scale is linear"
    conditions: Mahlkönig E65S, 65 mm steel burrs, 80-indicator scale.
    tag: derived
    evidence_grade: D
    sources:
      - citation: "Mahlkönig/Hemro. E65S product brochure (DE)."
        url: "https://downloads.mahlkoenig.de/Products/Mahlkoenig_E65S_Espresso_Grinder_Product_Brochure_DE.pdf"
      - citation: "Schmieder B.K.L., Pannusch V.B., Vannieuwenhuyse L., Briesen H., Minceva M. (2023) Influence of flow rate, particle size, and temperature on espresso extraction kinetics. Foods 12:2871."
        doi: "10.3390/foods12152871"
        locator: "§2.4"
    research_note_ref: ["03 §2.2", "03 Implications A"]
    used_by: [G]
    comment: >-
      Note 03 reads the brochure's "bandwidth of 180 to 580 µm" as axial burr movement; Schmieder 2023
      describes the same figure as a manufacturer-declared volume-mean-diameter bandwidth, so whether it
      is a gap or a particle size is uncertain. GL 1.4 → 2.0 is 7.5% of the scale, ≈30 µm nominal
      [derived, 03 §2.2]. Manufacturer specification, hence grade D.
    status: draft


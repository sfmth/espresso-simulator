    range: {min: 0}
    tag: estimated
    evidence_grade: B
    sources:
      - citation: "Grudeva Y., Moroney K.M., Foster J.M. (2026) A multiscale model for espresso brewing: asymptotic analysis and numerical simulation. Eur. J. Appl. Math. 37:496–519."
        doi: "10.1017/S095679252500018X"

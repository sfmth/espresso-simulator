    status: draft

  - id: psd.two_class.boulder_radius.grudeva2026
    name: Boulder radius in the Grudeva et al. 2026 parameter set
    symbol: a_b
    description: Radius of the boulders in the Grudeva, Moroney & Foster two-class model.
    units: um

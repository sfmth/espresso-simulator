        CO2; it is not a measured gas volume fraction. None of the calibration observables identifies a transient
        relative-permeability law. It is held at its prior rather than fitted to the held-out V4 first-drop delay
        or flow rise.
    model.hydraulics.pore_air_permeability_exponent:
      value: 3.0
      units: '1'
      reason: The effective connectivity-to-relative-permeability exponent is a grade D closure (3), not measured
        for these pucks. Held fixed; the V4 transient, V3 and V5 shot times do not select it.

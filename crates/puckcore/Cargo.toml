[package]
name = "puckcore"
description = "Puckworks numerical core: espresso puck physics and chemistry"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

# No required dependencies: licence hygiene, small WebAssembly, determinism.
# serde is optional, used only at the binding boundary (ADR 0008).
[dependencies]
serde = { workspace = true, optional = true }

[features]
serde = ["dep:serde"]
